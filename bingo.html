<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bingo</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --neon-pink: #f573a0;
            --neon-green: #1ed760;
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-data: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: white;
            min-height: 100vh; width: 100vw;
            font-family: var(--font-display);
            display: flex; flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://grainy-gradients.vercel.app/noise.svg'); opacity: 0.04; pointer-events: none; z-index: 999; }
        .ambilight-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; filter: blur(100px); background: radial-gradient(circle at 50% 50%, #f573a022, #000); }

        .container {
            position: relative;
            width: 100%;
            max-width: 450px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; color: var(--neon-pink); text-transform: uppercase; margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 0.75rem; font-family: var(--font-data); opacity: 0.5; letter-spacing: 2px; margin-bottom: 25px; }

        /* --- DISPLAY DO BINGO (GLOBO ANIMADO) --- */
        .bingo-sphere-wrapper {
            width: 140px; height: 140px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed var(--glass-border);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px; position: relative;
            box-shadow: 0 0 30px rgba(245, 115, 160, 0.05);
        }
        .bingo-sphere-wrapper.spinning {
            animation: rotateSphere 0.5s linear infinite;
            border-color: var(--neon-pink);
        }

        @keyframes rotateSphere {
            100% { transform: rotate(360deg); }
        }

        .current-ball {
            width: 90px; height: 90px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #f573a0);
            color: black; font-family: var(--font-data);
            font-size: 2.5rem; font-weight: 900;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(245, 115, 160, 0.4);
            transform: scale(1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }
        .bingo-sphere-wrapper.spinning .current-ball {
            transform: scale(0.7);
            animation: stopMotionCounter 0.5s linear infinite;
        }
        @keyframes stopMotionCounter {
            100% { transform: scale(0.7) rotate(-360deg); }
        }

        /* --- CARTELA DE JOGO --- */
        .card-container {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .card-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--neon-pink);
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .grid-bingo {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-data);
            font-size: 1.1rem; font-weight: 700;
            color: white; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cell:hover { background: rgba(255,255,255,0.05); }
        .cell.marked {
            background: rgba(245, 115, 160, 0.15);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(245, 115, 160, 0.5);
            transform: scale(0.95);
        }
        .cell.free-space {
            background: rgba(30, 215, 96, 0.1);
            border-color: var(--neon-green);
            color: var(--neon-green);
            font-size: 0.75rem;
            font-weight: 900;
        }

        /* --- PAINEL DO ADMIN / CONTROLES --- */
        .panel-controls {
            width: 100%;
            display: flex; flex-direction: column; gap: 12px;
        }

        .btn {
            background: var(--neon-pink); color: black; border: none; padding: 18px;
            border-radius: 16px; font-weight: 900; font-size: 1rem; width: 100%; cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: scale(0.97); }
        .btn-green { background: var(--neon-green); }

        /* --- ULTIMAS BOLAS SORTEADAS --- */
        .history-container {
            width: 100%; margin-top: 5px; margin-bottom: 25px;
            display: flex; flex-direction: column; align-items: center;
        }
        .history-title { font-size: 0.65rem; font-family: var(--font-data); letter-spacing: 1px; color: #666; text-transform: uppercase; margin-bottom: 8px; }
        .history-list { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding: 5px; justify-content: center; }
        .history-ball {
            min-width: 32px; height: 32px; border-radius: 50%;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-data); font-size: 0.75rem; color: #aaa;
            animation: popIn 0.3s ease both;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="noise"></div>
<div class="ambilight-bg"></div>

<div class="container">
    <h1>CYBER BINGO</h1>
    <div class="subtitle" id="room-display">SALA: ----</div>

    <div class="bingo-sphere-wrapper" id="sphere">
        <div class="current-ball" id="current-ball-val">--</div>
    </div>

    <div class="history-container">
        <div class="history-title">Últimos números</div>
        <div class="history-list" id="history-list">
        </div>
    </div>

    <div class="card-container">
        <div class="card-header">
            <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
        </div>
        <div class="grid-bingo" id="bingo-grid">
        </div>
    </div>

    <div class="panel-controls">
        <div id="host-panel" style="display: none; width: 100%;">
            <button class="btn" id="btn-spin" onclick="spinBingoBall()">
                <i class="fa-solid fa-dice"></i> GIRAR GLOBO
            </button>
        </div>
        <button class="btn btn-green" onclick="claimBingo()">
            <i class="fa-solid fa-trophy"></i> BINGO!
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Configuração IDÊNTICA à do seu hub principal
    const firebaseConfig = {
        apiKey: "AIzaSyB1buacNarLY8ELWla6yeqTi4L0vTdloSc",
        authDomain: "wrapped-fad94.firebaseapp.com",
        databaseURL: "https://wrapped-fad94-default-rtdb.firebaseio.com",
        projectId: "wrapped-fad94",
        storageBucket: "wrapped-fad94.firebasestorage.app",
        messagingSenderId: "360236097664",
        appId: "1:360236097664:web:76777f529c18623bf1c665"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room');
    const myId = localStorage.getItem('wrapped_uid');

    if(!roomCode) {
        alert("Sala não encontrada! Volte ao Menu.");
        window.location.href = "index.html";
    }

    document.getElementById('room-display').innerText = `SALA: ${roomCode}`;

    const roomRef = ref(db, `rooms/${roomCode}`);
    const bingoRef = ref(db, `rooms/${roomCode}/bingo`);
    
    let isHost = false;
    let pool = Array.from({length: 75}, (_, i) => i + 1); // Pool estática padrão Bingo de 1 a 75

    // --- 1. GERAR SEMENTE BASEADA NO ID DO JOGADOR (Garante cartela única e persistente na sessão) ---
    function generateBingoCard() {
        // Intervalos oficiais do Bingo tradicional
        const ranges = [
            { min: 1, max: 15 },  // B
            { min: 16, max: 30 }, // I
            { min: 31, max: 45 }, // N
            { min: 46, max: 60 }, // G
            { min: 61, max: 75 }  // O
        ];

        const columns = ranges.map(range => {
            let numbers = [];
            while(numbers.length < 5) {
                let num = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                if(!numbers.includes(num)) numbers.push(num);
            }
            return numbers.sort((a,b) => a - b);
        });

        const grid = document.getElementById('bingo-grid');
        grid.innerHTML = '';

        for(let row = 0; row < 5; row++) {
            for(let col = 0; col < 5; col++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if(row === 2 && col === 2) {
                    cell.className = 'cell free-space';
                    cell.innerText = 'FREE';
                    cell.classList.add('marked');
                } else {
                    const numberValue = columns[col][row];
                    cell.innerText = numberValue;
                    cell.dataset.number = numberValue;
                    cell.onclick = () => cell.classList.toggle('marked');
                }
                grid.appendChild(cell);
            }
        }
    }

    // --- 2. LOGICA EM TEMPO REAL (FIREBASE) ---
    get(roomRef).then(snap => {
        if(snap.exists()) {
            const data = snap.val();
            if(data.host === myId) {
                isHost = true;
                document.getElementById('host-panel').style.display = 'block';
                // Inicializa a árvore do bingo no banco de dados se for o Admin
                update(bingoRef, { currentBall: "--", lastBalls: "", spinning: false, gameOver: false });
            }
        }
    });

    generateBingoCard();

    // Ouvir atualizações globais do Bingo
    onValue(bingoRef, (snap) => {
        const data = snap.val();
        if(!data) return;

        // Se o jogo foi finalizado por um vencedor
        if(data.gameOver) {
            alert(`O JOGO TERMINOU! Vencedor: ${data.winnerName || "Alguém"}`);
            document.getElementById('btn-spin') ? document.getElementById('btn-spin').disabled = true : null;
            return;
        }

        const sphere = document.getElementById('sphere');
        const currentBallVal = document.getElementById('current-ball-val');
        const historyList = document.getElementById('history-list');

        if(data.spinning) {
            sphere.classList.add('spinning');
            currentBallVal.innerText = "??";
        } else {
            sphere.classList.remove('spinning');
            currentBallVal.innerText = data.currentBall;
            
            // Atualizar Histórico de Bolas
            historyList.innerHTML = '';
            if(data.lastBalls) {
                const arr = data.lastBalls.split(',').reverse().slice(0, 7);
                arr.forEach(val => {
                    if(val) historyList.innerHTML += `<div class="history-ball">${val}</div>`;
                });
            }
        }
    });

    // --- 3. FUNÇÃO DE GIRAR DO ADMINISTRADOR ---
    window.spinBingoBall = function() {
        if(!isHost) return;

        document.getElementById('btn-spin').disabled = true;
        update(bingoRef, { spinning: true });

        setTimeout(() => {
            get(bingoRef).then(snap => {
                const data = snap.val() || {};
                
                if(data.gameOver) return; // Trava se jogo já acabou

                let drawn = data.lastBalls ? data.lastBalls.split(',') : [];
                
                // Filtrar os números que ainda sobram
                let available = pool.filter(n => !drawn.includes(n.toString()));

                if(available.length === 0) {
                    alert("Todas as bolas já foram sorteadas!");
                    update(bingoRef, { spinning: false });
                    document.getElementById('btn-spin').disabled = false;
                    return;
                }

                // Sorteia elemento randômico do pool disponível
                let luckyNumber = available[Math.floor(Math.random() * available.length)];
                drawn.push(luckyNumber);

                update(bingoRef, {
                    spinning: false,
                    currentBall: luckyNumber,
                    lastBalls: drawn.join(',')
                });
                
                document.getElementById('btn-spin').disabled = false;
            });
        }, 1500); // 1.5s de rotação cyberpunk simulada
    };

    // --- 4. FUNÇÃO GRITAR BINGO (COM VALIDAÇÃO AUTOMÁTICA) ---
    window.claimBingo = function() {
        get(bingoRef).then(bingoSnap => {
            const bingoData = bingoSnap.val() || {};
            if(bingoData.gameOver) {
                alert("O jogo já acabou!");
                return;
            }

            // Pega a lista de números que de fato já saíram no sorteio global
            const drawnBalls = bingoData.lastBalls ? bingoData.lastBalls.split(',') : [];

            // Mapeia visualmente a matriz 5x5 do DOM
            const cells = Array.from(document.querySelectorAll('#bingo-grid .cell'));
            let cardMatrix = [];
            for (let i = 0; i < 5; i++) {
                cardMatrix.push(cells.slice(i * 5, (i + 1) * 5));
            }

            let hasBingo = false;

            // 1. Verificar Linhas Completas e Válidas
            for (let r = 0; r < 5; r++) {
                let rowMarked = true;
                for (let c = 0; c < 5; c++) {
                    const cell = cardMatrix[r][c];
                    const isMarked = cell.classList.contains('marked');
                    const isFree = cell.classList.contains('free-space');
                    const num = cell.dataset.number;
                    // Para ser válida, a célula marcada pelo player precisa ter sido sorteada pelo Host (exceto o FREE)
                    if (!isMarked || (!isFree && !drawnBalls.includes(num))) {
                        rowMarked = false;
                        break;
                    }
                }
                if (rowMarked) { hasBingo = true; break; }
            }

            // 2. Verificar Colunas Completas e Válidas
            if (!hasBingo) {
                for (let c = 0; c < 5; c++) {
                    let colMarked = true;
                    for (let r = 0; r < 5; r++) {
                        const cell = cardMatrix[r][c];
                        const isMarked = cell.classList.contains('marked');
                        const isFree = cell.classList.contains('free-space');
                        const num = cell.dataset.number;
                        if (!isMarked || (!isFree && !drawnBalls.includes(num))) {
                            colMarked = false;
                            break;
                        }
                    }
                    if (colMarked) { hasBingo = true; break; }
                }
            }

            // 3. Verificar Diagonal Principal (\)
            if (!hasBingo) {
                let diag1Marked = true;
                for (let i = 0; i < 5; i++) {
                    const cell = cardMatrix[i][i];
                    const isMarked = cell.classList.contains('marked');
                    const isFree = cell.classList.contains('free-space');
                    const num = cell.dataset.number;
                    if (!isMarked || (!isFree && !drawnBalls.includes(num))) {
                        diag1Marked = false;
                        break;
                    }
                }
                if (diag1Marked) hasBingo = true;
            }

            // 4. Verificar Diagonal Secundária (/)
            if (!hasBingo) {
                let diag2Marked = true;
                for (let i = 0; i < 5; i++) {
                    const cell = cardMatrix[i][4 - i];
                    const isMarked = cell.classList.contains('marked');
                    const isFree = cell.classList.contains('free-space');
                    const num = cell.dataset.number;
                    if (!isMarked || (!isFree && !drawnBalls.includes(num))) {
                        diag2Marked = false;
                        break;
                    }
                }
                if (diag2Marked) hasBingo = true;
            }

            // --- AÇÃO BASEADA NO RESULTADO DA ANÁLISE ---
            if (hasBingo) {
                get(ref(db, `rooms/${roomCode}/players/${myId}`)).then(pSnap => {
                    const name = pSnap.exists() ? pSnap.val().name : "Um jogador";
                    
                    // Altera a árvore do Firebase finalizando globalmente a partida
                    update(bingoRef, {
                        gameOver: true,
                        winnerName: name
                    }).then(() => {
                        alert(`BINGO CONFIRMADO! Parabéns, você venceu o jogo!`);
                    });
                });
            } else {
                alert("Bingo falso! Verifique se você marcou números que não foram sorteados ou se esqueceu de fechar uma linha/coluna.");
            }
        });
    };
</script>
</body>
</html>
