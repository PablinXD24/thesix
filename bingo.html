<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bingo</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --neon-pink: #f573a0;
            --neon-green: #1ed760;
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-data: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: white;
            min-height: 100vh; width: 100vw;
            font-family: var(--font-display);
            display: flex; flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://grainy-gradients.vercel.app/noise.svg'); opacity: 0.04; pointer-events: none; z-index: 999; }
        .ambilight-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; filter: blur(100px); background: radial-gradient(circle at 50% 50%, #f573a022, #000); }

        .container {
            position: relative;
            width: 100%;
            max-width: 450px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: -2px; color: var(--neon-pink); text-transform: uppercase; margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 0.75rem; font-family: var(--font-data); opacity: 0.5; letter-spacing: 2px; margin-bottom: 25px; }

        /* --- DISPLAY DO BINGO (GLOBO ANIMADO) --- */
        .bingo-sphere-wrapper {
            width: 140px; height: 140px;
            background: rgba(0,0,0,0.4);
            border: 2px dashed var(--glass-border);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px; position: relative;
            box-shadow: 0 0 30px rgba(245, 115, 160, 0.05);
        }
        .bingo-sphere-wrapper.spinning {
            animation: rotateSphere 0.5s linear infinite;
            border-color: var(--neon-pink);
        }

        @keyframes rotateSphere {
            100% { transform: rotate(360deg); }
        }

        .current-ball {
            width: 90px; height: 90px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #f573a0);
            color: black; font-family: var(--font-data);
            font-size: 2.5rem; font-weight: 900;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(245, 115, 160, 0.4);
            transform: scale(1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }
        .bingo-sphere-wrapper.spinning .current-ball {
            transform: scale(0.7);
            animation: stopMotionCounter 0.5s linear infinite;
        }
        @keyframes stopMotionCounter {
            100% { transform: scale(0.7) rotate(-360deg); }
        }

        /* --- CARTELA DE JOGO --- */
        .card-container {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .card-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--neon-pink);
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .grid-bingo {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-data);
            font-size: 1.1rem; font-weight: 700;
            color: white; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cell:hover { background: rgba(255,255,255,0.05); }
        .cell.marked {
            background: rgba(245, 115, 160, 0.15);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(245, 115, 160, 0.5);
            transform: scale(0.95);
        }
        .cell.free-space {
            background: rgba(30, 215, 96, 0.1);
            border-color: var(--neon-green);
            color: var(--neon-green);
            font-size: 0.75rem;
            font-weight: 900;
        }

        /* --- PAINEL DO ADMIN / CONTROLES --- */
        .panel-controls {
            width: 100%;
            display: flex; flex-direction: column; gap: 12px;
        }

        .btn {
            background: var(--neon-pink); color: black; border: none; padding: 18px;
            border-radius: 16px; font-weight: 900; font-size: 1rem; width: 100%; cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: scale(0.97); }
        .btn-green { background: var(--neon-green); }

        /* --- ULTIMAS BOLAS SORTEADAS --- */
        .history-container {
            width: 100%; margin-top: 5px; margin-bottom: 25px;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(255, 255, 255, 0.01);
            border: 1px dashed var(--glass-border);
            padding: 10px; border-radius: 16px;
        }
        .history-title { font-size: 0.65rem; font-family: var(--font-data); letter-spacing: 1px; color: #666; text-transform: uppercase; margin-bottom: 8px; }
        .history-list { 
            display: flex; gap: 8px; overflow-x: auto; width: 100%; padding: 5px; 
            justify-content: flex-start; scroll-behavior: smooth;
        }
        .history-list::-webkit-scrollbar { height: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        
        .history-ball {
            min-width: 34px; height: 34px; border-radius: 50%;
            background: rgba(245, 115, 160, 0.05); border: 1px solid rgba(245, 115, 160, 0.2);
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-data); font-size: 0.8rem; color: var(--neon-pink);
            font-weight: 700; animation: popIn 0.3s ease both;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

        /* --- TELA DE ANIMAÇÃO DO BINGO --- */
        .bingo-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.95); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
            backdrop-filter: blur(15px);
        }
        .bingo-overlay.active { opacity: 1; pointer-events: auto; }
        .bingo-title-anim {
            font-size: 4rem; font-weight: 900; color: var(--neon-green);
            text-transform: uppercase; letter-spacing: -3px;
            text-shadow: 0 0 20px rgba(30, 215, 96, 0.6);
            animation: pulseNeon 1s ease infinite alternate, scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .bingo-winner-name {
            font-family: var(--font-data); font-size: 1.2rem; color: white;
            margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.9;
            animation: fadeInDelay 1s ease 0.4s both;
        }
        .confetti {
            position: absolute; width: 8px; height: 8px; opacity: 0.8;
            animation: fall linear infinite;
        }
        @keyframes pulseNeon { from { text-shadow: 0 0 10px rgba(30, 215, 96, 0.4); } to { text-shadow: 0 0 30px rgba(30, 215, 96, 0.9), 0 0 50px rgba(30, 215, 96, 0.4); } }
        @keyframes scaleUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeInDelay { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.9; transform: translateY(0); } }
        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg); top: 0; }
            100% { transform: translateY(105vh) rotate(360deg); top: 0; }
        }

        /* --- ESTILOS DO SISTEMA DE PUNISHMENT --- */
        .punishment-panel {
            width: 100%;
            background: rgba(245, 115, 160, 0.03);
            border: 1px dashed var(--neon-pink);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            animation: popIn 0.3s ease both;
        }
        .punishment-text {
            font-family: var(--font-data);
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid var(--neon-pink);
        }
        .target-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding: 5px 0;
        }
        .target-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: var(--font-data);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .target-btn:hover {
            background: var(--neon-pink);
            color: black;
            border-color: var(--neon-pink);
        }
    </style>
</head>
<body>

<div class="noise"></div>
<div class="ambilight-bg"></div>

<div class="bingo-overlay" id="bingo-overlay">
    <div class="bingo-title-anim"><i class="fa-solid fa-trophy"></i> BINGO!</div>
    <div class="bingo-winner-name" id="winner-display">VENCEDOR: ----</div>
</div>

<div class="container">
    <h1>CYBER BINGO</h1>
    <div class="subtitle" id="room-display">SALA: ----</div>

    <div class="bingo-sphere-wrapper" id="sphere">
        <div class="current-ball" id="current-ball-val">--</div>
    </div>

    <div class="history-container">
        <div class="history-title">Últimos números (Arraste para o lado)</div>
        <div class="history-list" id="history-list">
        </div>
    </div>

    <div class="punishment-panel" id="punishment-panel">
        <div class="history-title" style="color: var(--neon-pink); font-weight: bold; margin-bottom: 5px;"><i class="fa-solid fa-skull"></i> PUNIÇÃO LIBERADA!</div>
        <div class="punishment-text" id="punishment-text">Carregando castigo...</div>
        <div class="history-title" style="font-size: 0.55rem; text-align: left;">Escolha quem vai pagar:</div>
        <div class="target-list" id="target-list"></div>
    </div>

    <div class="card-container">
        <div class="card-header">
            <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
        </div>
        <div class="grid-bingo" id="bingo-grid">
        </div>
    </div>

    <div class="panel-controls">
        <div id="host-panel" style="display: none; width: 100%;">
            <button class="btn" id="btn-spin" onclick="spinBingoBall()">
                <i class="fa-solid fa-dice"></i> GIRAR GLOBO
            </button>
        </div>
        <button class="btn btn-green" onclick="claimBingo()">
            <i class="fa-solid fa-trophy"></i> BINGO!
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1buacNarLY8ELWla6yeqTi4L0vTdloSc",
        authDomain: "wrapped-fad94.firebaseapp.com",
        databaseURL: "https://wrapped-fad94-default-rtdb.firebaseio.com",
        projectId: "wrapped-fad94",
        storageBucket: "wrapped-fad94.firebasestorage.app",
        messagingSenderId: "360236097664",
        appId: "1:360236097664:web:76777f529c18623bf1c665"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room');
    const myId = localStorage.getItem('wrapped_uid');

    if(!roomCode) {
        alert("Sala não encontrada! Volte ao Menu.");
        window.location.href = "index.html";
    }

    document.getElementById('room-display').innerText = `SALA: ${roomCode}`;

    const roomRef = ref(db, `rooms/${roomCode}`);
    const bingoRef = ref(db, `rooms/${roomCode}/bingo`);
    
    let isHost = false;
    let pool = Array.from({length: 75}, (_, i) => i + 1);
    let globalDrawnBalls = [];

    // Variáveis de controle para o sistema de punições
    let punishmentsList = [];
    let markedCount = 0; 
    let activePunishment = "";

    // Carregar a lista de punições do desafios.json
    fetch('desafios.json')
        .then(response => response.json())
        .then(data => {
            if(data && data.punishments) {
                punishmentsList = data.punishments;
            }
        })
        .catch(err => console.error("Erro ao carregar desafios.json:", err));

    function generateBingoCard() {
        const ranges = [
            { min: 1, max: 15 },  // B
            { min: 16, max: 30 }, // I
            { min: 31, max: 45 }, // N
            { min: 46, max: 60 }, // G
            { min: 61, max: 75 }  // O
        ];

        const columns = ranges.map(range => {
            let numbers = [];
            while(numbers.length < 5) {
                let num = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                if(!numbers.includes(num)) numbers.push(num);
            }
            return numbers.sort((a,b) => a - b);
        });

        const grid = document.getElementById('bingo-grid');
        grid.innerHTML = '';

        for(let row = 0; row < 5; row++) {
            for(let col = 0; col < 5; col++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if(row === 2 && col === 2) {
                    cell.className = 'cell free-space';
                    cell.innerText = 'FREE';
                    cell.classList.add('marked');
                } else {
                    const numberValue = columns[col][row];
                    cell.innerText = numberValue;
                    cell.dataset.number = numberValue;
                    
                    cell.onclick = () => {
                        if (globalDrawnBalls.includes(numberValue.toString())) {
                            const wasMarked = cell.classList.contains('marked');
                            cell.classList.toggle('marked');

                            // Lógica de contagem de números marcados manualmente
                            if (!wasMarked && cell.classList.contains('marked')) {
                                markedCount++;
                                if (markedCount > 0 && markedCount % 2 === 0) {
                                    triggerPunishmentRelease();
                                }
                            } else if (wasMarked && !cell.classList.contains('marked')) {
                                markedCount = Math.max(0, markedCount - 1);
                            }
                        }
                    };
                }
                grid.appendChild(cell);
            }
        }
    }

    // Seleciona um castigo aleatório e renderiza a lista de alvos da partida
    function triggerPunishmentRelease() {
        if (punishmentsList.length === 0) return;
        
        activePunishment = punishmentsList[Math.floor(Math.random() * punishmentsList.length)];
        document.getElementById('punishment-text').innerText = activePunishment;
        
        // Puxar jogadores da sala no Firebase para listar os nomes
        get(ref(db, `rooms/${roomCode}/players`)).then(snap => {
            const targetsContainer = document.getElementById('target-list');
            targetsContainer.innerHTML = '';
            
            if (snap.exists()) {
                const playersData = snap.val();
                Object.keys(playersData).forEach(pId => {
                    const player = playersData[pId];
                    
                    const btn = document.createElement('button');
                    btn.className = 'target-btn';
                    btn.innerText = player.name;
                    btn.onclick = () => {
                        alert(`Você aplicou a punição para: ${player.name}!\n"${activePunishment}"`);
                        document.getElementById('punishment-panel').style.display = 'none';
                    };
                    targetsContainer.appendChild(btn);
                });
            }
            document.getElementById('punishment-panel').style.display = 'block';
        });
    }

    // Função interna para instanciar a animação de confetes caindo
    function startConfettiAnimation() {
        const overlay = document.getElementById('bingo-overlay');
        const colors = ['#1ed760', '#f573a0', '#ffffff', '#00f0ff', '#ff003c'];
        for (let i = 0; i < 100; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.transform = `scale(${Math.random() * 1.5 + 0.5})`;
            confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
            confetti.style.animationDelay = Math.random() * 2 + 's';
            overlay.appendChild(confetti);
        }
    }

    get(roomRef).then(snap => {
        if(snap.exists()) {
            const data = snap.val();
            if(data.host === myId) {
                isHost = true;
                document.getElementById('host-panel').style.display = 'block';
            }
        }
    });

    generateBingoCard();

    // Ouvir atualizações globais do Bingo
    onValue(bingoRef, (snap) => {
        const data = snap.val();
        if(!data) return;

        // Modificado: Executa a animação Cyberpunk em vez do alert de navegador padrão
        if(data.gameOver) {
            document.getElementById('winner-display').innerText = `VENDEDOR: ${data.winnerName || "Alguém"}`;
            document.getElementById('bingo-overlay').classList.add('active');
            startConfettiAnimation();
            document.getElementById('btn-spin') ? document.getElementById('btn-spin').disabled = true : null;
            return;
        }

        const sphere = document.getElementById('sphere');
        const currentBallVal = document.getElementById('current-ball-val');
        const historyList = document.getElementById('history-list');

        globalDrawnBalls = data.lastBalls ? data.lastBalls.split(',') : [];

        if(data.spinning) {
            sphere.classList.add('spinning');
            currentBallVal.innerText = "??";
        } else {
            sphere.classList.remove('spinning');
            currentBallVal.innerText = data.currentBall;
            
            historyList.innerHTML = '';
            if(data.lastBalls) {
                const arr = data.lastBalls.split(',');
                arr.forEach(val => {
                    if(val) historyList.innerHTML += `<div class="history-ball">${val}</div>`;
                });
                setTimeout(() => { historyList.scrollLeft = historyList.scrollWidth; }, 50);
            }
        }
    });

    window.spinBingoBall = function() {
        if(!isHost) return;

        document.getElementById('btn-spin').disabled = true;
        update(bingoRef, { spinning: true });

        setTimeout(() => {
            get(bingoRef).then(snap => {
                const data = snap.val() || {};
                
                if(data.gameOver) return;

                let drawn = data.lastBalls ? data.lastBalls.split(',') : [];
                let available = pool.filter(n => !drawn.includes(n.toString()));

                if(available.length === 0) {
                    alert("Todas as bolas já foram sorteadas!");
                    update(bingoRef, { spinning: false });
                    document.getElementById('btn-spin').disabled = false;
                    return;
                }

                let luckyNumber = available[Math.floor(Math.random() * available.length)];
                drawn.push(luckyNumber);

                update(bingoRef, {
                    spinning: false,
                    currentBall: luckyNumber,
                    lastBalls: drawn.join(',')
                });
                
                document.getElementById('btn-spin').disabled = false;
            });
        }, 1500);
    };

    window.claimBingo = function() {
        get(bingoRef).then(bingoSnap => {
            const bingoData = bingoSnap.val() || {};
            if(bingoData.gameOver) return;

            const drawnBalls = bingoData.lastBalls ? bingoData.lastBalls.split(',') : [];
            const cells = Array.from(document.querySelectorAll('#bingo-grid .cell'));
            
            let cardMatrix = [];
            for (let i = 0; i < 5; i++) {
                cardMatrix.push(cells.slice(i * 5, (i + 1) * 5));
            }

            let validLinesCount = 0;

            function isValidMarked(cell) {
                if (cell.classList.contains('free-space')) return false; 
                return cell.classList.contains('marked') && drawnBalls.includes(cell.dataset.number);
            }

            for (let r = 0; r < 5; r++) {
                let count = 0;
                for (let c = 0; c < 5; c++) {
                    if (isValidMarked(cardMatrix[r][c])) count++;
                }
                if (count === 5 || (r === 2 && count === 4)) { 
                    validLinesCount++; 
                }
            }

            for (let c = 0; c < 5; c++) {
                let count = 0;
                for (let r = 0; r < 5; r++) {
                    if (isValidMarked(cardMatrix[r][c])) count++;
                }
                if (count === 5 || (c === 2 && count === 4)) { 
                    validLinesCount++; 
                }
            }

            let diag1Count = 0;
            for (let i = 0; i < 5; i++) {
                if (isValidMarked(cardMatrix[i][i])) diag1Count++;
            }
            if (diag1Count === 5 || diag1Count === 4) {
                let containsFree = false;
                for(let i=0; i<5; i++) if(cardMatrix[i][i].classList.contains('free-space')) containsFree = true;
                if(!containsFree && diag1Count === 5) validLinesCount++;
                if(containsFree && diag1Count === 4) validLinesCount++;
            }

            let diag2Count = 0;
            for (let i = 0; i < 5; i++) {
                if (isValidMarked(cardMatrix[i][4 - i])) diag2Count++;
            }
            if (diag2Count === 5 || diag2Count === 4) {
                let containsFree = false;
                for(let i=0; i<5; i++) if(cardMatrix[i][4-i].classList.contains('free-space')) containsFree = true;
                if(!containsFree && diag2Count === 5) validLinesCount++;
                if(containsFree && diag2Count === 4) validLinesCount++;
            }

            let hasCornerBingo = false;
            const corners = [cardMatrix[0][0], cardMatrix[0][4], cardMatrix[4][0], cardMatrix[4][4]];
            let validCorners = corners.filter(cell => isValidMarked(cell)).length;
            if (validCorners === 4) {
                hasCornerBingo = true;
            }

            let containsMiddleRowOrCol = false;
            let middleRowFilled = (isValidMarked(cardMatrix[2][0]) && isValidMarked(cardMatrix[2][1]) && isValidMarked(cardMatrix[2][3]) && isValidMarked(cardMatrix[2][4]));
            let middleColFilled = (isValidMarked(cardMatrix[0][2]) && isValidMarked(cardMatrix[1][2]) && isValidMarked(cardMatrix[3][2]) && isValidMarked(cardMatrix[4][2]));
            
            if (middleRowFilled || middleColFilled) {
                containsMiddleRowOrCol = true;
            }

            let isWinner = false;

            if (hasCornerBingo) {
                isWinner = true;
            } else if (containsMiddleRowOrCol) {
                if (validLinesCount >= 2) isWinner = true;
            } else {
                if (validLinesCount >= 1) isWinner = true;
            }

            if (isWinner) {
                get(ref(db, `rooms/${roomCode}/players/${myId}`)).then(pSnap => {
                    const name = pSnap.exists() ? pSnap.val().name : "Um jogador";
                    
                    update(bingoRef, {
                        gameOver: true,
                        winnerName: name
                    });
                });
            } else {
                if (containsMiddleRowOrCol && validLinesCount < 2) {
                    alert("O espaço 'FREE' não vale ponto! Como você usou a linha/coluna do meio, você precisa completar mais uma fileira ou fechar a Quina.");
                } else {
                    alert("Bingo inválido! Verifique se há números marcados incorretamente ou se completou uma fileira/quina válida.");
                }
            }
        });
    };
</script>
</body>
</html>
