<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BINMIGOS</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&family=Comfortaa:wght@400;700&display=swap');

        :root {
            --aero-orange: #ff7000;
            --aero-orange-light: #ffaa44;
            --aero-blue: #00b4d8;
            --aero-cyan: #2ec4b6;
            --aero-green: #70e000;
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #ffedd5 50%, #ccfbf1 100%);
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.85);
            --font-display: 'Quicksand', sans-serif;
            --font-data: 'Comfortaa', cursive;
            --text-dark: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh; width: 100vw;
            font-family: var(--font-display);
            display: flex; flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
        }

        /* Camadas de Esferas Líquidas de fundo Estilo Apple */
        .noise { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at 10% 15%, rgba(255, 112, 0, 0.22) 0%, transparent 30%),
                        radial-gradient(circle at 90% 25%, rgba(0, 180, 216, 0.25) 0%, transparent 35%),
                        radial-gradient(circle at 50% 90%, rgba(112, 224, 0, 0.18) 0%, transparent 30%),
                        radial-gradient(circle at 25% 65%, rgba(255, 159, 28, 0.2) 0%, transparent 25%);
            pointer-events: none; z-index: 1; 
        }
        .ambilight-bg { 
            position: fixed; top: -30%; left: -30%; width: 160%; height: 160%; z-index: 0; opacity: 0.7; 
            background: radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(255,241,217,0.5) 50%, transparent 100%);
            animation: fluidMotion 20s ease-in-out infinite alternate;
        }

        @keyframes fluidMotion {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            100% { transform: translate(4%, 3%) rotate(8deg) scale(1.08); }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 450px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        h1 { 
            font-size: 2.9rem; font-weight: 900; letter-spacing: -1.5px; 
            background: linear-gradient(135deg, var(--aero-orange), #ff9f1c, var(--aero-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; margin-bottom: 2px; text-align: center;
            filter: drop-shadow(0 3px 6px rgba(255, 112, 0, 0.2));
        }
        .subtitle { 
            font-size: 0.8rem; font-family: var(--font-data); color: var(--aero-orange);
            background: linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0.5));
            padding: 5px 16px; border-radius: 20px;
            box-shadow: 0 4px 12px rgba(255, 112, 0, 0.08), inset 0 1px 1px #fff; 
            border: 1px solid var(--glass-border);
            letter-spacing: 1.5px; margin-bottom: 25px; font-weight: bold;
        }

        /* --- GLOBO ULTRA-LIQUID GLASS --- */
        .bingo-sphere-wrapper {
            width: 150px; height: 150px;
            background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.95) 0%, rgba(255,220,180,0.4) 40%, rgba(0,180,216,0.15) 100%);
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px; position: relative;
            box-shadow: 0 25px 45px rgba(255, 112, 0, 0.15), 
                        inset 0 -12px 25px rgba(0,119,182,0.08), 
                        inset 0 12px 25px rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        /* Cápsula de Reflexo de Vidro Líquido Superior (Estilo Apple Aqua) */
        .bingo-sphere-wrapper::after {
            content: ''; position: absolute; top: 6px; left: 50%; width: 85px; height: 40px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.05) 100%);
            border-radius: 50% / 20px; transform: translateX(-50%); pointer-events: none;
        }

        .bingo-sphere-wrapper.spinning {
            animation: liquidBounce 0.5s ease-in-out infinite alternate;
            border-color: var(--aero-orange-light);
        }

        @keyframes liquidBounce {
            0% { transform: scale(1) translateY(0); box-shadow: 0 15px 30px rgba(255, 112, 0, 0.15); }
            100% { transform: scale(1.06) translateY(-6px); box-shadow: 0 25px 50px rgba(0, 180, 216, 0.3); }
        }

        .current-ball {
            width: 100px; height: 100px;
            background: linear-gradient(to bottom, #ff9f1c 0%, var(--aero-orange) 40%, #cc4e00 100%);
            position: relative; overflow: hidden;
            color: white; font-family: var(--font-data);
            font-size: 2.8rem; font-weight: 900;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 14px 28px rgba(255, 112, 0, 0.45), 
                        inset 0 -6px 15px rgba(0,0,0,0.25), 
                        inset 0 6px 15px rgba(255,255,255,0.7);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 2;
        }
        /* Brilho interno em forma de gota na bola ativa */
        .current-ball::before {
            content: ''; position: absolute; top: 4px; left: 15%; width: 70%; height: 35%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50% / 15px; pointer-events: none;
        }
        
        .bingo-sphere-wrapper.spinning .current-ball {
            transform: scale(0.85);
            animation: liquidWobble 0.4s ease-in-out infinite alternate;
        }
        @keyframes liquidWobble {
            0% { border-radius: 44% 56% 48% 52% / 52% 44% 56% 48%; }
            100% { border-radius: 56% 44% 52% 48% / 44% 56% 44% 56%; }
        }

        /* --- CONTAINER DO TABULEIRO ACESSÍVEL --- */
        .card-container {
            width: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.35) 100%);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border-radius: 30px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 25px 55px rgba(255, 112, 0, 0.08), 
                        inset 0 1px 3px rgba(255,255,255,0.8),
                        inset 0 -3px 10px rgba(0,0,0,0.02);
        }

        .card-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--aero-orange);
            margin-bottom: 16px;
            text-shadow: 0 2px 3px rgba(255,255,255,0.95);
        }

        .grid-bingo {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        /* Células estilo botões macios de Acrílico/Gel da Apple */
        .cell {
            background: linear-gradient(to bottom, rgba(255,255,255,0.75) 0%, rgba(240,240,240,0.5) 100%);
            border: 1px solid rgba(255,255,255,0.9);
            aspect-ratio: 1;
            border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-data);
            font-size: 1.25rem; font-weight: 700;
            color: #1e293b; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03), 
                        inset 0 -2px 5px rgba(0,0,0,0.03),
                        inset 0 2px 5px rgba(255,255,255,0.8);
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cell::before {
            content: ''; position: absolute; top: 2px; left: 10%; width: 80%; height: 30%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50% / 6px; pointer-events: none;
        }
        .cell:hover { background: rgba(255,255,255,0.95); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(255,112,0,0.12); }
        
        /* Marcado estilo Gota de Gel Laranja */
        .cell.marked {
            background: linear-gradient(to bottom, #ffaa44 0%, var(--aero-orange) 50%, #e05300 100%);
            border-color: rgba(255,255,255,0.5);
            color: white;
            box-shadow: 0 8px 18px rgba(255, 112, 0, 0.4), 
                        inset 0 -3px 6px rgba(0,0,0,0.2), 
                        inset 0 3px 6px rgba(255,255,255,0.5);
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
            transform: scale(0.94);
        }
        .cell.marked::before {
            background: linear-gradient(to bottom, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
        }
        
        /* FREE estilo Gota de Gel Azul Turquesa */
        .cell.free-space {
            background: linear-gradient(to bottom, #52e5e7 0%, var(--aero-blue) 60%, #0077b6 100%);
            border-color: rgba(255,255,255,0.5);
            color: white;
            box-shadow: 0 8px 18px rgba(0, 180, 216, 0.4), 
                        inset 0 -3px 6px rgba(0,0,0,0.2), 
                        inset 0 3px 6px rgba(255,255,255,0.5);
            font-size: 0.85rem;
            font-weight: 900;
        }

        /* --- CONTROLES LÍQUIDOS --- */
        .panel-controls {
            width: 100%;
            display: flex; flex-direction: column; gap: 14px;
            z-index: 10;
        }

        .btn {
            background: linear-gradient(to bottom, #ffb350 0%, #ff8000 45%, var(--aero-orange) 60%, #cc4e00 100%);
            color: white; border: 1px solid rgba(255,255,255,0.5); padding: 18px;
            border-radius: 22px; font-weight: 900; font-size: 1.1rem; width: 100%; cursor: pointer;
            box-shadow: 0 12px 28px rgba(255, 112, 0, 0.3), 
                        inset 0 -4px 0 rgba(0,0,0,0.2), 
                        inset 0 3px 6px rgba(255,255,255,0.6);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-shadow: 0 2px 3px rgba(0,0,0,0.2);
            position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 2px; left: 5%; width: 90%; height: 35%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50% / 12px; pointer-events: none;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 16px 35px rgba(255, 112, 0, 0.4); filter: brightness(1.05); }
        .btn:active { transform: translateY(1px); box-shadow: 0 6px 15px rgba(255, 112, 0, 0.25); }
        
        .btn-green { 
            background: linear-gradient(to bottom, #b5f522 0%, #82db00 45%, var(--aero-green) 60%, #4da300 100%);
            box-shadow: 0 12px 28px rgba(112, 224, 0, 0.3), 
                        inset 0 -4px 0 rgba(0,0,0,0.2), 
                        inset 0 3px 6px rgba(255,255,255,0.6);
        }
        .btn-green:hover { box-shadow: 0 16px 35px rgba(112, 224, 0, 0.4); }

        /* --- HISTÓRICO DE BOLAS --- */
        .history-container {
            width: 100%; margin-top: 5px; margin-bottom: 25px;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0.3));
            border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 22px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }
        .history-title { font-size: 0.75rem; font-weight: 900; color: var(--aero-orange); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .history-list { 
            display: flex; gap: 9px; overflow-x: auto; width: 100%; padding: 4px; 
            justify-content: flex-start; scroll-behavior: smooth;
        }
        .history-list::-webkit-scrollbar { height: 6px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255, 112, 0, 0.3); border-radius: 10px; }
        
        .history-ball {
            min-width: 40px; height: 40px; border-radius: 50%;
            background: radial-gradient(circle at 35% 25%, #ffffff 0%, #fff7ed 60%, #fed7aa 100%); 
            border: 1px solid rgba(255, 112, 0, 0.3);
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-data); font-size: 0.95rem; color: var(--aero-orange);
            font-weight: 700; box-shadow: 0 4px 8px rgba(0,0,0,0.04), inset 0 2px 4px #fff;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .history-ball::before {
            content: ''; position: absolute; top: 2px; left: 20%; width: 60%; height: 30%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50% / 5px;
        }

        /* --- TELA DE VITÓRIA --- */
        .bingo-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(239, 246, 255, 0.85); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        .bingo-overlay.active { opacity: 1; pointer-events: auto; }
        
        .bingo-title-anim {
            font-size: 5rem; font-weight: 900; 
            background: linear-gradient(135deg, var(--aero-orange), #ff007f, var(--aero-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: -1.5px;
            filter: drop-shadow(0 8px 20px rgba(255,112,0,0.3));
            animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both, aeroPulse 1.2s ease-in-out infinite alternate;
        }
        .bingo-winner-name {
            font-family: var(--font-data); font-size: 1.4rem; color: var(--aero-orange);
            background: linear-gradient(to bottom, #fff, #f6f6f6); padding: 12px 32px; border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255,112,0,0.15), inset 0 2px 4px #fff; border: 1px solid var(--glass-border);
            margin-top: 25px; letter-spacing: 1px; text-transform: uppercase;
            animation: fadeInDelay 1s ease 0.4s both;
        }
        .confetti {
            position: absolute; width: 16px; height: 16px; opacity: 0.6;
            border-radius: 50%; 
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.15), inset 3px 3px 8px rgba(255,255,255,0.9);
            animation: fall linear infinite;
        }
        @keyframes aeroPulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        @keyframes scaleUp { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeInDelay { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fall {
            0% { transform: translateY(-5vh) translateX(0) scale(0.8); top: 0; }
            50% { transform: translateY(50vh) translateX(30px) scale(1.1); top: 0; }
            100% { transform: translateY(105vh) translateX(-30px) scale(0.8); top: 0; }
        }

        /* --- POPUP DE CASTIGO --- */
        .punish-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.4); z-index: 1050;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: 20px;
        }
        .punish-overlay.active { opacity: 1; pointer-events: auto; }
        
        .punish-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.75) 100%);
            border: 1px solid rgba(255,255,255,0.95);
            box-shadow: 0 40px 80px rgba(255, 112, 0, 0.18), inset 0 2px 4px rgba(255,255,255,0.9);
            border-radius: 32px; padding: 30px; width: 100%; max-width: 400px;
            text-align: center; transform: scale(0.7); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }
        .punish-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 38%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.65), rgba(255,255,255,0));
            pointer-events: none;
        }

        .punish-overlay.active .punish-card { transform: scale(1); }
        .punish-card h2 { 
            background: linear-gradient(135deg, var(--aero-orange), var(--aero-orange-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 1.9rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; letter-spacing: -0.5px; 
        }
        .punish-text { 
            background: linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0.5)); 
            border: 1px solid rgba(255, 112, 0, 0.25); 
            padding: 16px; border-radius: 18px; font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; color: #1e293b; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .punish-target-title { font-size: 0.8rem; font-weight: bold; color: var(--aero-blue); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        
        .player-select-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 5px; }
        .player-select-list::-webkit-scrollbar { width: 5px; }
        .player-select-list::-webkit-scrollbar-thumb { background: rgba(255, 112, 0, 0.25); border-radius: 4px; }
        
        .btn-target-player { 
            background: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(245,245,245,0.6) 100%); 
            color: #1e293b; border: 1px solid rgba(255,255,255,0.95); 
            padding: 13px; border-radius: 16px; font-weight: 700; font-size: 0.95rem; cursor: pointer; 
            transition: all 0.2s; text-transform: uppercase; width: 100%; text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.02), inset 0 1px 2px #fff;
            position: relative;
        }
        .btn-target-player::before {
            content: ''; position: absolute; top: 1px; left: 10%; width: 80%; height: 30%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50% / 4px;
        }
        .btn-target-player:hover { 
            background: linear-gradient(to bottom, #ffaa44, var(--aero-orange)); color: white; 
            box-shadow: 0 8px 18px rgba(255, 112, 0, 0.3); transform: translateY(-1px); border-color: rgba(255,255,255,0.3);
        }
        .btn-target-player:hover::before { background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%); }
    </style>
</head>
<body>

<div class="noise"></div>
<div class="ambilight-bg"></div>

<div class="bingo-overlay" id="bingo-overlay">
    <div class="bingo-title-anim"><i class="fa-solid fa-trophy"></i> BINGO!</div>
    <div class="bingo-winner-name" id="winner-display">VENCEDOR: ----</div>
</div>

<div class="punish-overlay" id="punish-overlay">
    <div class="punish-card">
        <h2><i class="fa-solid fa-skull"></i> Castigo Liberado!</h2>
        <div class="punish-text" id="punish-text-content">Carregando castigo...</div>
        <div class="punish-target-title">Escolha o alvo para cumprir:</div>
        <div class="player-select-list" id="player-select-list">
            </div>
    </div>
</div>

<div class="container">
    <h1>BINMIGOS</h1>
    <div class="subtitle" id="room-display">SALA: ----</div>

    <div class="bingo-sphere-wrapper" id="sphere">
        <div class="current-ball" id="current-ball-val">--</div>
    </div>

    <div class="history-container">
        <div class="history-title">Últimos números (Arraste para o lado)</div>
        <div class="history-list" id="history-list">
        </div>
    </div>

    <div class="card-container">
        <div class="card-header">
            <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
        </div>
        <div class="grid-bingo" id="bingo-grid">
        </div>
    </div>

    <div class="panel-controls">
        <div id="host-panel" style="display: none; width: 100%;">
            <button class="btn" id="btn-spin" onclick="spinBingoBall()">
                <i class="fa-solid fa-dice"></i> GIRAR GLOBO
            </button>
        </div>
        <button class="btn btn-green" onclick="claimBingo()">
            <i class="fa-solid fa-trophy"></i> BINGO!
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1buacNarLY8ELWla6yeqTi4L0vTdloSc",
        authDomain: "wrapped-fad94.firebaseapp.com",
        databaseURL: "https://wrapped-fad94-default-rtdb.firebaseio.com",
        projectId: "wrapped-fad94",
        storageBucket: "wrapped-fad94.firebasestorage.app",
        messagingSenderId: "360236097664",
        appId: "1:360236097664:web:76777f529c18623bf1c665"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room');
    const myId = localStorage.getItem('wrapped_uid');

    if(!roomCode) {
        alert("Sala não encontrada! Volte ao Menu.");
        window.location.href = "index.html";
    }

    let lastValidMarkedCount = 0;

    function checkPunishmentTrigger() {
        const cells = Array.from(document.querySelectorAll('#bingo-grid .cell'));
        let currentValidMarked = 0;

        cells.forEach(cell => {
            if (!cell.classList.contains('free-space') && cell.classList.contains('marked') && globalDrawnBalls.includes(cell.dataset.number)) {
                currentValidMarked++;
            }
        });

        if (currentValidMarked > lastValidMarkedCount) {
            const difference = currentValidMarked - lastValidMarkedCount;
            const markerStep = Math.floor(currentValidMarked / 2) - Math.floor(lastValidMarkedCount / 2);
            
            if (markerStep > 0) {
                triggerPunishModal();
            }
        }
        lastValidMarkedCount = currentValidMarked;
    }

                        // Ao clicar, envia o castigo e o alvo de forma sincronizada globalmente no banco
                        set(globalPunishRef, {
                            targetName: players[pId].name || "Jogador Anonimo",
                            challenge: randomPunish,
                            timestamp: Date.now()
                        }).then(() => {
                            document.getElementById('punish-overlay').classList.remove('active');
                        });
                    };
                    listContainer.appendChild(btn);
                });
            } else {
                listContainer.innerHTML = '<div style="color:#666; font-size:0.9rem;">Nenhum jogador na sala.</div>';
            }
        });

        document.getElementById('punish-overlay').classList.add('active');
    }

    // Função interna para guardar e atualizar as células marcadas localmente
    function saveCardStateToStorage(matrixNumbers, markedIndexes) {
        const storageKeyNumbers = `bingo_card_numbers_${roomCode}`;
        const storageKeyMarked = `bingo_card_marked_${roomCode}`;
        localStorage.setItem(storageKeyNumbers, JSON.stringify(matrixNumbers));
        localStorage.setItem(storageKeyMarked, JSON.stringify(markedIndexes));
    }

    function generateBingoCard() {
        const grid = document.getElementById('bingo-grid');
        grid.innerHTML = '';

        const storageKeyNumbers = `bingo_card_numbers_${roomCode}`;
        const storageKeyMarked = `bingo_card_marked_${roomCode}`;
        
        let savedNumbers = localStorage.getItem(storageKeyNumbers);
        let savedMarked = localStorage.getItem(storageKeyMarked);

        let flatNumbers = [];
        let markedIndexes = [];

        if (savedNumbers) {
            flatNumbers = JSON.parse(savedNumbers);
            if (savedMarked) {
                markedIndexes = JSON.parse(savedMarked);
            }
        } else {
            const ranges = [
                { min: 1, max: 15 },  // B
                { min: 16, max: 30 }, // I
                { min: 31, max: 45 }, // N
                { min: 46, max: 60 }, // G
                { min: 61, max: 75 }  // O
            ];

            const columns = ranges.map(range => {
                let numbers = [];
                while(numbers.length < 5) {
                    let num = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                    if(!numbers.includes(num)) numbers.push(num);
                }
                return numbers.sort((a,b) => a - b);
            });

            for(let row = 0; row < 5; row++) {
                for(let col = 0; col < 5; col++) {
                    if(row === 2 && col === 2) {
                        flatNumbers.push('FREE');
                    } else {
                        flatNumbers.push(columns[col][row]);
                    }
                }
            }
            markedIndexes = [12]; // Central (FREE) sempre marcado por padrão
            saveCardStateToStorage(flatNumbers, markedIndexes);
        }

        flatNumbers.forEach((val, idx) => {
            const cell = document.createElement('div');
            cell.className = 'cell';

            if (val === 'FREE') {
                cell.className = 'cell free-space';
                cell.innerText = 'FREE';
                cell.classList.add('marked');
            } else {
                cell.innerText = val;
                cell.dataset.number = val;

                if (markedIndexes.includes(idx)) {
                    cell.classList.add('marked');
                }

                cell.onclick = () => {
                    if (globalDrawnBalls.includes(val.toString())) {
                        cell.classList.toggle('marked');
                        
                        let currentMarked = JSON.parse(localStorage.getItem(storageKeyMarked)) || [12];
                        if (cell.classList.contains('marked')) {
                            if (!currentMarked.includes(idx)) currentMarked.push(idx);
                        } else {
                            currentMarked = currentMarked.filter(i => i !== idx);
                        }
                        localStorage.setItem(storageKeyMarked, JSON.stringify(currentMarked));

                        checkPunishmentTrigger();
                    }
                };
            }
            grid.appendChild(cell);
        });
    }

    // Função interna para instanciar a animação de confetes caindo
    function startConfettiAnimation() {
        const overlay = document.getElementById('bingo-overlay');
        const colors = ['#ff7000', '#ff9f1c', '#00b4d8', '#70e000', '#ffffff'];
        for (let i = 0; i < 100; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.transform = `scale(${Math.random() * 1.5 + 0.5})`;
            confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
            confetti.style.animationDelay = Math.random() * 2 + 's';
            overlay.appendChild(confetti);
        }
    }

    get(roomRef).then(snap => {
        if(snap.exists()) {
            const data = snap.val();
            if(data.host === myId) {
                isHost = true;
                document.getElementById('host-panel').style.display = 'block';
            }
        }
    });

    generateBingoCard();

    // Ouvir atualizações globais de punições da sala
    onValue(globalPunishRef, (snap) => {
        const data = snap.val();
        if(!data) return;

        const punishCard = document.querySelector('.punish-card');
        punishCard.innerHTML = `
            <h2><i class="fa-solid fa-skull-crossbones"></i> CASTIGO ENVIADO!</h2>
            <div class="punish-target-title" style="font-size: 1.1rem; color: #1e293b; margin-top: 15px; margin-bottom: 5px;">
                Alvo: <span style="color: var(--aero-orange); font-weight: 900;">${data.targetName}</span>
            </div>
            <div class="punish-text" style="border-color: rgba(255, 112, 0, 0.3); margin-bottom: 15px; background: white;">
                ${data.challenge}
            </div>
            <button class="btn btn-green" id="btn-close-punish-alert" style="padding: 10px; font-size: 0.85rem; border-radius: 10px;">
                OK, ENTENDIDO!
            </button>
        `;

        document.getElementById('btn-close-punish-alert').onclick = () => {
            document.getElementById('punish-overlay').classList.remove('active');
        };

        document.getElementById('punish-overlay').classList.add('active');
    });

    // Ouvir atualizações globais do Bingo
    onValue(bingoRef, (snap) => {
        const data = snap.val();
        if(!data) return;

        // Modificado: Executa a animação Cyberpunk em vez do alert de navegador padrão
        if(data.gameOver) {
            document.getElementById('winner-display').innerText = `VENDEDOR: ${data.winnerName || "Alguém"}`;
            document.getElementById('bingo-overlay').classList.add('active');
            startConfettiAnimation();
            document.getElementById('btn-spin') ? document.getElementById('btn-spin').disabled = true : null;
            return;
        }

        const sphere = document.getElementById('sphere');
        const currentBallVal = document.getElementById('current-ball-val');
        const historyList = document.getElementById('history-list');

        globalDrawnBalls = data.lastBalls ? data.lastBalls.split(',') : [];

        if(data.spinning) {
            sphere.classList.add('spinning');
            currentBallVal.innerText = "??";
        } else {
            sphere.classList.remove('spinning');
            currentBallVal.innerText = data.currentBall;
            
            historyList.innerHTML = '';
            if(data.lastBalls) {
                const arr = data.lastBalls.split(',');
                arr.forEach(val => {
                    if(val) historyList.innerHTML += `<div class="history-ball">${val}</div>`;
                });
                setTimeout(() => { historyList.scrollLeft = historyList.scrollWidth; }, 50);
            }
            checkPunishmentTrigger();
        }
    });

    window.spinBingoBall = function() {
        if(!isHost) return;

        document.getElementById('btn-spin').disabled = true;
        update(bingoRef, { spinning: true });

        setTimeout(() => {
            get(bingoRef).then(snap => {
                const data = snap.val() || {};
                
                if(data.gameOver) return;

                let drawn = data.lastBalls ? data.lastBalls.split(',') : [];
                let available = pool.filter(n => !drawn.includes(n.toString()));

                if(available.length === 0) {
                    alert("Todas as bolas já foram sorteadas!");
                    update(bingoRef, { spinning: false });
                    document.getElementById('btn-spin').disabled = false;
                    return;
                }

                let luckyNumber = available[Math.floor(Math.random() * available.length)];
                drawn.push(luckyNumber);

                update(bingoRef, {
                    spinning: false,
                    currentBall: luckyNumber,
                    lastBalls: drawn.join(',')
                });
                
                document.getElementById('btn-spin').disabled = false;
            });
        }, 1500);
    };

    window.claimBingo = function() {
        get(bingoRef).then(bingoSnap => {
            const bingoData = bingoSnap.val() || {};
            if(bingoData.gameOver) return;

            const drawnBalls = bingoData.lastBalls ? bingoData.lastBalls.split(',') : [];
            const cells = Array.from(document.querySelectorAll('#bingo-grid .cell'));
            
            let cardMatrix = [];
            for (let i = 0; i < 5; i++) {
                cardMatrix.push(cells.slice(i * 5, (i + 1) * 5));
            }

            let validLinesCount = 0;

            function isValidMarked(cell) {
                if (cell.classList.contains('free-space')) return false; 
                return cell.classList.contains('marked') && drawnBalls.includes(cell.dataset.number);
            }

            for (let r = 0; r < 5; r++) {
                let count = 0;
                for (let c = 0; c < 5; c++) {
                    if (isValidMarked(cardMatrix[r][c])) count++;
                }
                if (count === 5 || (r === 2 && count === 4)) { 
                    validLinesCount++; 
                }
            }

            for (let c = 0; c < 5; c++) {
                let count = 0;
                for (let r = 0; r < 5; r++) {
                    if (isValidMarked(cardMatrix[r][c])) count++;
                }
                if (count === 5 || (c === 2 && count === 4)) { 
                    validLinesCount++; 
                }
            }

            let diag1Count = 0;
            for (let i = 0; i < 5; i++) {
                if (isValidMarked(cardMatrix[i][i])) diag1Count++;
            }
            if (diag1Count === 5 || diag1Count === 4) {
                let containsFree = false;
                for(let i=0; i<5; i++) if(cardMatrix[i][i].classList.contains('free-space')) containsFree = true;
                if(!containsFree && diag1Count === 5) validLinesCount++;
                if(containsFree && diag1Count === 4) validLinesCount++;
            }

            let diag2Count = 0;
            for (let i = 0; i < 5; i++) {
                if (isValidMarked(cardMatrix[i][4 - i])) diag2Count++;
            }
            if (diag2Count === 5 || diag2Count === 4) {
                let containsFree = false;
                for(let i=0; i<5; i++) if(cardMatrix[i][4-i].classList.contains('free-space')) containsFree = true;
                if(!containsFree && diag2Count === 5) validLinesCount++;
                if(containsFree && diag2Count === 4) validLinesCount++;
            }

            let hasCornerBingo = false;
            const corners = [cardMatrix[0][0], cardMatrix[0][4], cardMatrix[4][0], cardMatrix[4][4]];
            let validCorners = corners.filter(cell => isValidMarked(cell)).length;
            if (validCorners === 4) {
                hasCornerBingo = true;
            }

            let containsMiddleRowOrCol = false;
            let middleRowFilled = (isValidMarked(cardMatrix[2][0]) && isValidMarked(cardMatrix[2][1]) && isValidMarked(cardMatrix[2][3]) && isValidMarked(cardMatrix[2][4]));
            let middleColFilled = (isValidMarked(cardMatrix[0][2]) && isValidMarked(cardMatrix[1][2]) && isValidMarked(cardMatrix[3][2]) && isValidMarked(cardMatrix[4][2]));
            
            if (middleRowFilled || middleColFilled) {
                containsMiddleRowOrCol = true;
            }

            let isWinner = false;

            if (hasCornerBingo) {
                isWinner = true;
            } else if (containsMiddleRowOrCol) {
                if (validLinesCount >= 2) isWinner = true;
            } else {
                if (validLinesCount >= 1) isWinner = true;
            }

            if (isWinner) {
                get(ref(db, `rooms/${roomCode}/players/${myId}`)).then(pSnap => {
                    const name = pSnap.exists() ? pSnap.val().name : "Um jogador";
                    
                    update(bingoRef, {
                        gameOver: true,
                        winnerName: name
                    });
                });
            } else {
                if (containsMiddleRowOrCol && validLinesCount < 2) {
                    alert("O espaço 'FREE' não vale ponto! Como você usou a linha/coluna do meio, você precisa completar mais uma fileira ou fechar a Quina.");
                } else {
                    alert("Bingo inválido! Verifique se há números marcados incorretamente ou se completou uma fileira/quina válida.");
                }
            }
        });
    };
</script>
