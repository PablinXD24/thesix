<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DEDO NO GATILHO - THE TIMELESS</title>
    
    <link rel="icon" href="data:,">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-display: 'Syne', sans-serif;
            --font-data: 'Space Grotesk', sans-serif;
            --font-mono: 'VT323', monospace;
            --neon-green: #00ff66;
            --neon-yellow: #ffd600;
            --neon-red: #ff2a75;
            --neon-cyan: #00bfff;
            --bg-dark: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: #000;
            height: 100vh; width: 100vw; overflow: hidden;
            font-family: var(--font-data);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background-color 0.2s ease;
        }

        /* Efeito de flash na tela durante a roleta */
        body.roulette-hit {
            background-color: #ffd600 !important;
        }

        .ambilight {
            position: fixed; inset: 0; z-index: 0; opacity: 0.15;
            background: repeating-linear-gradient(45deg, #222, #222 1px, transparent 1px, transparent 10px);
            transition: all 0.3s ease;
        }

        /* --- DYNAMIC ISLAND (ESTÉTICA MODERNA DO INDEX) --- */
        .island-container {
            position: fixed; top: 12px; width: 100%; display: flex; justify-content: center; z-index: 9999; pointer-events: none;
        }
        .island {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            width: 160px; height: 42px;
            border-radius: 24px; pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            border: 2px solid #ff2a75;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 4px 20px rgba(255, 42, 117, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            cursor: pointer; position: relative;
        }
        .island.mini-active { width: 48px; height: 48px; border-radius: 50%; border-color: #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.5); }
        .island.active { width: 360px; height: 85px; border-radius: 20px; border-color: #ffd600; box-shadow: 0 6px 30px rgba(255, 214, 0, 0.5); }

        .island-content {
            width: 100%; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
            opacity: 0; transition: opacity 0.3s ease; position: absolute; pointer-events: none;
        }
        .island.active .island-content { opacity: 1; pointer-events: auto; }
        .island-mini-status { display: flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .island.active .island-mini-status { opacity: 0; transform: scale(0.5); }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff2a75; border: 1px solid rgba(255,255,255,0.4); }
        .dot.online { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .island-mini-status span { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700; color: #fff; text-shadow: 0 0 5px rgba(0,255,102,0.5); }
        
        #island-mini-icon { display: none; font-size: 16px; color: #00ff66; filter: drop-shadow(0 0 5px #00ff66); }
        .island.mini-active #island-mini-icon { display: block; }
        .island.mini-active .island-mini-status { display: none; }

        .island-info-text { display: flex; flex-direction: column; line-height: 1.2; flex: 1; margin-left: 12px; overflow: hidden; }
        .island-label { font-size: 0.7rem; color: #ffd600; font-weight: 700; text-transform: uppercase; font-family: var(--font-mono); letter-spacing: 1px; }
        .island-main { 
            font-size: 0.95rem; font-weight: 800; color: #ffffff; font-family: var(--font-display); 
            white-space: normal; overflow: visible; max-width: 220px; line-height: 1.15; word-break: break-word;
        }

        .game-content { 
            position: relative; z-index: 10; text-align: center; width: 100%; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100%; max-height: 750px;
        }

        .header h1 { 
            font-family: var(--font-display); font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; 
            text-transform: uppercase; letter-spacing: -2px; line-height: 0.9; margin-bottom: 8px; color: #fff; 
        }
        .header p { color: var(--neon-green); font-family: var(--font-mono); font-size: 1rem; min-height: 1.2em; font-weight: 700; }
        #player-names-list { color: rgba(255,255,255,0.6); font-size: 0.75rem; text-transform: uppercase; margin-top: 6px; max-width: 320px; word-break: break-word; font-family: var(--font-data); font-weight: 700; }

        /* SELETOR DE MODO (HOST) */
        .mode-toggle-container {
            display: flex; gap: 10px; margin-top: 15px; z-index: 20; justify-content: center;
        }
        .btn-mode {
            background: #ffffff; border: 3px solid #000000; color: #000;
            padding: 8px 16px; border-radius: 0px; font-size: 0.8rem;
            font-family: var(--font-data); font-weight: 800; cursor: pointer;
            box-shadow: 4px 4px 0px #000000; transition: all 0.2s ease; text-transform: uppercase;
        }
        .btn-mode.active {
            border-color: #000000; color: #000;
            background: var(--neon-yellow);
            box-shadow: 4px 4px 0px #000000;
            transform: translate(-2px, -2px);
        }

        .trigger-zone {
            width: 250px; height: 250px; margin: 0 auto;
            border-radius: 50%; border: 4px dashed rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            position: relative; transition: all 0.3s ease;
        }

        .finger-pad {
            width: 150px; height: 150px; border-radius: 50%;
            background: #ffffff; border: 4px solid #000000;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; color: #000;
            box-shadow: 6px 6px 0px #000000;
            transition: all 0.1s ease; cursor: pointer; z-index: 15;
        }

        .pad-active { transform: scale(0.92); background: var(--neon-green) !important; color: black !important; border-color: #000 !important; box-shadow: 2px 2px 0px #000 !important; }
        .pad-active.roulette-mode { background: var(--neon-cyan) !important; box-shadow: 2px 2px 0px #000 !important; }
        
        .zone-ready { border: 4px solid var(--neon-red); border-style: solid; box-shadow: 0 0 40px rgba(255, 42, 117, 0.4); }
        .zone-warn { border: 4px solid var(--neon-yellow); border-style: solid; box-shadow: 0 0 40px rgba(255, 214, 0, 0.4); }
        .zone-go { border: 4px solid var(--neon-green); border-style: solid; box-shadow: 0 0 60px rgba(0, 255, 102, 0.4); }
        .zone-roulette { border: 4px solid var(--neon-cyan); border-style: solid; box-shadow: 0 0 50px rgba(0, 191, 255, 0.4); }

        /* LUZ DA ROLETA NO PRÓPRIO CELULAR */
        .zone-roulette-active {
            border: 6px solid #ffffff !important;
            background: radial-gradient(circle, rgba(255,214,0,0.8) 0%, rgba(255,42,117,0.4) 100%) !important;
            box-shadow: 0 0 80px #ffd600, inset 0 0 40px #fff !important;
            animation: pulseRoulette 0.15s ease infinite alternate;
        }
        .zone-roulette-active .finger-pad {
            background: #ffffff !important; color: #000000 !important; border-color: #ffd600 !important; transform: scale(1.05);
        }

        @keyframes pulseRoulette {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        #punish-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 3000; display: none; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        .punish-card {
            background: #ffd600; color: black; padding: 35px 25px; border-radius: 0px;
            width: 85%; max-width: 360px; border: 4px solid #000;
            box-shadow: 8px 8px 0px #000; transform: rotate(-2deg);
        }
        .punish-card h2 { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; margin-bottom: 8px; text-transform: uppercase; word-break: break-word; }
        .punish-card p { font-weight: 700; font-size: 1.1rem; color: #000; line-height: 1.3; font-family: var(--font-data); }

        .btn-next {
            margin-top: 40px; background: #00ff66; color: #000; border: 4px solid #000; padding: 16px 40px;
            border-radius: 0px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; cursor: pointer;
            box-shadow: 6px 6px 0px #000;
            transition: 0.2s; text-transform: uppercase;
        }
        .btn-next:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
    </style>
</head>
<body>

<div class="ambilight" id="bg-glow"></div>

<div class="island-container">
    <div class="island" id="dynamic-island">
        <i id="island-mini-icon" class="fa-solid fa-bolt"></i>
        <div class="island-mini-status">
            <div class="dot" id="status-dot"></div>
            <span id="mini-player-count">ONLINE</span>
        </div>
        <div class="island-content">
            <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                <div style="width: 36px; height: 36px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #ff2a75; flex-shrink: 0;">
                    <i id="island-icon" class="fa-solid fa-bolt" style="color: #ffd600;"></i>
                </div>
                <div class="island-info-text">
                    <span class="island-label" id="island-label">SISTEMA</span>
                    <span class="island-main" id="island-text">CONECTADO</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="game-content">
    <div class="header">
        <h1>DEDO NO<br>GATILHO</h1>
        <p id="status-label">AGUARDANDO JOGADORES...</p>
        <div id="player-names-list"></div>

        <!-- Seletor de Modo (visível para o Host ou informativo) -->
        <div class="mode-toggle-container" id="mode-selector">
            <button class="btn-mode active" id="btn-mode-classic" onclick="setGameMode('classic')">
                <i class="fa-solid fa-stopwatch"></i> REAÇÃO
            </button>
            <button class="btn-mode" id="btn-mode-roulette" onclick="setGameMode('roulette')">
                <i class="fa-solid fa-circle-notch"></i> ROLETA DE LUZ
            </button>
        </div>
    </div>

    <div class="trigger-zone" id="zone">
        <div class="finger-pad" id="pad" 
             onmousedown="onPress()" onmouseup="onRelease()" 
             ontouchstart="onPress(event)" ontouchend="onRelease(event)">
            <i class="fa-solid fa-fingerprint"></i>
        </div>
    </div>

    <p style="margin-bottom: 20px; font-weight: 800; opacity: 0.6; font-size: 0.8rem; letter-spacing: 2px; color: #fff;">MANTENHA PRESSIONADO PARA ATIVAR</p>
</div>

<div id="punish-modal">
    <div class="punish-card">
        <p style="color: #ff2a75; font-weight: 900; margin-bottom: 5px;" id="punish-header">SORTEADO!</p>
        <h2 id="loser-name">VOCÊ</h2>
        <hr style="margin: 15px 0; border: 0; border-top: 3px solid #000;">
        <p id="punish-desc">Bebendo um shot de...</p>
    </div>
    <button class="btn-next" onclick="resetRound()">PRÓXIMA RODADA</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyB1buacNarLY8ELWla6yeqTi4L0vTdloSc", 
        authDomain: "wrapped-fad94.firebaseapp.com", 
        databaseURL: "https://wrapped-fad94-default-rtdb.firebaseio.com", 
        projectId: "wrapped-fad94", 
        storageBucket: "wrapped-fad94.firebasestorage.app", 
        messagingSenderId: "360236097664", 
        appId: "1:360236097664:web:76777f529c18623bf1c665" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room');
    
    let myId = localStorage.getItem('wrapped_uid') || "user_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('wrapped_uid', myId);

    function getLatestName() {
        return localStorage.getItem('wrapped_name') || localStorage.getItem('userName') || "Jogador";
    }

    let myName = getLatestName();
    let isHost = false;
    let currentGameMode = 'classic'; 
    let state = 'IDLE';
    let isPressing = false;
    let startTime = 0;
    let matchStarted = false;

    // --- ELEMENTOS DA ISLAND ---
    const islandEl = document.getElementById('dynamic-island');
    const dotEl = document.getElementById('status-dot');
    if (islandEl) {
        islandEl.onclick = () => { islandEl.classList.toggle('active'); };
    }

    function notifyIsland(label, main, type = "default") {
        const islandLabel = document.getElementById('island-label');
        const islandMain = document.getElementById('island-text');
        if (!islandLabel || !islandMain || !islandEl) return;
        islandLabel.innerText = label;
        islandMain.innerText = main;
        islandEl.classList.add('active');
        if(dotEl) dotEl.classList.add('online');
        setTimeout(() => {
            islandEl.classList.remove('active');
            islandEl.classList.add('mini-active');
        }, 3000);
    }

    // --- CARREGAR PUNIÇÕES DO ARQUIVO DESAFIOS.JSON ---
    let punicoes = [];
    async function loadPunishments() {
        try {
            const response = await fetch('desafios.json');
            if (response.ok) {
                const data = await response.json();
                if (data && data.punishments && Array.isArray(data.punishments)) {
                    punicoes = data.punishments;
                }
            }
        } catch (e) {
            console.error("Erro ao carregar punições do desafios.json:", e);
        }
        if (punicoes.length === 0) {
            punicoes = ["Vire uma dose de Askov pura.", "Beba um shot de Gin puro."];
        }
    }
    loadPunishments();

    // --- SISTEMA DE ÁUDIO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration, vol = 0.1) {
        if (audioCtx.state === 'suspended') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    const sfx = {
        press: () => playSound(400, 'sine', 0.08, 0.2),
        ready: () => playSound(220, 'square', 0.3, 0.1),
        warn: () => playSound(440, 'square', 0.3, 0.1),
        go: () => { playSound(880, 'sine', 0.4, 0.3); playSound(1200, 'sine', 0.2, 0.2); },
        error: () => { playSound(150, 'sawtooth', 0.4, 0.2); playSound(100, 'sawtooth', 0.6, 0.2); },
        win: () => { [523.25, 659.25, 783.99].forEach((f, i) => setTimeout(() => playSound(f, 'sine', 0.3, 0.1), i * 120)); },
        rouletteTick: () => playSound(800, 'triangle', 0.06, 0.25),
        rouletteHit: () => { playSound(1000, 'sawtooth', 0.15, 0.3); }
    };

    if(roomCode) {
        const playerRef = ref(db, `rooms/${roomCode}/players/${myId}`);
        onDisconnect(playerRef).remove();

        get(ref(db, `rooms/${roomCode}`)).then((snapshot) => {
            if(snapshot.exists()) {
                const roomData = snapshot.val();
                if(roomData.host === myId) isHost = true;
                if(roomData.players && roomData.players[myId]) {
                    myName = roomData.players[myId].name || myName;
                    localStorage.setItem('wrapped_name', myName);
                }
            }
            update(playerRef, { 
                isReady: false, 
                name: myName,
                id: myId,
                lastSeen: serverTimestamp() 
            });
            updateHostControlsUI();
        });

        onValue(ref(db, `rooms/${roomCode}/game_mode`), (snapshot) => {
            const mode = snapshot.val();
            if(mode) {
                currentGameMode = mode;
                updateModeButtonsUI(mode);
            }
        });

        onValue(ref(db, `rooms/${roomCode}/trigger_state`), (snapshot) => {
            const data = snapshot.val();
            if(data) updateUI(data);
        });

        onValue(ref(db, `rooms/${roomCode}/players`), (snapshot) => {
            const players = snapshot.val() || {};
            const playerList = Object.values(players);
            const totalPlayers = playerList.length;
            const readyPlayers = playerList.filter(p => p.isReady).length;

            const namesString = playerList.map(p => (p.id === myId ? `★ ${p.name}` : p.name)).join(" • ");
            document.getElementById('player-names-list').innerText = namesString;
            const miniCountEl = document.getElementById('mini-player-count');
            if(miniCountEl) miniCountEl.innerText = `${totalPlayers} PLAYERS`;

            if(state === 'IDLE') {
                document.getElementById('status-label').innerText = `DEDOS NA TELA: ${readyPlayers}/${totalPlayers}`;
                
                if(totalPlayers >= 2 && readyPlayers === totalPlayers && !matchStarted) {
                    matchStarted = true;
                    if(isHost) {
                        const nextMode = currentGameMode === 'classic' ? 'roulette' : 'classic';
                        update(ref(db, `rooms/${roomCode}`), { game_mode: nextMode });

                        if(nextMode === 'roulette') {
                            startRouletteMatch(playerList);
                        } else {
                            startClassicMatch();
                        }
                    }
                }
            }
        });
    }

    function updateHostControlsUI() {
        const selector = document.getElementById('mode-selector');
        if(!isHost) {
            selector.style.pointerEvents = 'none';
            selector.style.opacity = '0.7';
        }
    }

    function updateModeButtonsUI(mode) {
        document.getElementById('btn-mode-classic').classList.toggle('active', mode === 'classic');
        document.getElementById('btn-mode-roulette').classList.toggle('active', mode === 'roulette');
    }

    window.setGameMode = (mode) => {
        if(!isHost) return;
        currentGameMode = mode;
        update(ref(db, `rooms/${roomCode}`), { game_mode: mode });
    };

    function updateUI(data) {
        const oldState = state;
        state = data.phase;
        const zone = document.getElementById('zone');
        const label = document.getElementById('status-label');
        const body = document.body;

        if(state !== 'RESULT') {
            document.getElementById('punish-modal').style.display = 'none';
            body.classList.remove('roulette-hit');
        }

        zone.className = "trigger-zone";
        
        switch(state) {
            case 'READY':
                if(oldState !== 'READY') sfx.ready();
                zone.classList.add('zone-ready');
                label.innerText = "NÃO SOLTE O DEDO!";
                break;
            case 'WARN':
                if(oldState !== 'WARN') sfx.warn();
                zone.classList.add('zone-warn');
                label.innerText = "PREPARE-SE...";
                break;
            case 'GO':
                if(oldState !== 'GO') sfx.go();
                zone.classList.add('zone-go');
                label.innerText = "SOLTE AGORA!";
                if(startTime === 0) startTime = Date.now();
                break;
            case 'ROULETTE_SPIN':
                zone.classList.add('zone-roulette');
                label.innerText = "ROLETA GIRANDO...";

                if(data.activePlayerId === myId) {
                    zone.classList.add('zone-roulette-active');
                    body.classList.add('roulette-hit');
                    sfx.rouletteHit();
                    if(navigator.vibrate) navigator.vibrate(60);
                } else {
                    body.classList.remove('roulette-hit');
                    sfx.rouletteTick();
                }
                break;
            case 'RESULT':
                if(oldState !== 'RESULT') sfx.error();
                showResult(data.loserName, data.punishment, data.reasonText);
                break;
            case 'IDLE':
                body.classList.remove('roulette-hit');
                startTime = 0;
                matchStarted = false;
                break;
        }
    }

    window.onPress = (e) => {
        if(e) e.preventDefault();
        if(state === 'RESULT' || state === 'ROULETTE_SPIN') return;
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        sfx.press();
        isPressing = true;
        const pad = document.getElementById('pad');
        pad.classList.add('pad-active');
        if(currentGameMode === 'roulette') pad.classList.add('roulette-mode');
        
        update(ref(db, `rooms/${roomCode}/players/${myId}`), { 
            isReady: true, 
            name: myName, 
            id: myId,
            lastSeen: serverTimestamp() 
        });
    };

    window.onRelease = async (e) => {
        if(e) e.preventDefault();
        if(!isPressing) return;
        isPressing = false;
        
        const pad = document.getElementById('pad');
        pad.classList.remove('pad-active', 'roulette-mode');
        
        if(state === 'IDLE') {
            update(ref(db, `rooms/${roomCode}/players/${myId}`), { isReady: false });
        }

        if(currentGameMode === 'classic') {
            if(state === 'READY' || state === 'WARN') {
                reportEnd(myName, "SOLTOU CEDO DEMAIS!", "QUEIMOU A LARGADA!");
            } else if(state === 'GO') {
                const reactionTime = Date.now() - startTime;
                await set(ref(db, `rooms/${roomCode}/results/${myId}`), { 
                    name: myName, 
                    time: reactionTime 
                });
                checkLastOne();
            }
        }
    };

    async function startClassicMatch() {
        const roomRef = ref(db, `rooms/${roomCode}/trigger_state`);
        await remove(ref(db, `rooms/${roomCode}/results`));
        await update(roomRef, { phase: 'READY', loserName: null });
        
        setTimeout(async () => {
            const snap = await get(roomRef);
            if(snap.val()?.phase === 'READY') update(roomRef, { phase: 'WARN' });
        }, 2000);
        
        const randomWait = 1500 + Math.random() * 3000;
        setTimeout(async () => {
            const snap = await get(roomRef);
            if(snap.val()?.phase === 'WARN') update(roomRef, { phase: 'GO' });
        }, 3500 + randomWait);
    }

    async function checkLastOne() {
        const playersSnap = await get(ref(db, `rooms/${roomCode}/players`));
        const resultsSnap = await get(ref(db, `rooms/${roomCode}/results`));
        
        const players = playersSnap.val() || {};
        const resultsData = resultsSnap.val() || {};
        
        const totalPlayers = Object.keys(players).length;
        const finishedPlayers = Object.keys(resultsData).length;

        if(finishedPlayers >= totalPlayers && totalPlayers > 0) {
            const results = Object.values(resultsData);
            results.sort((a, b) => b.time - a.time);
            const loser = results[0];
            const randomPunish = punicoes[Math.floor(Math.random() * punicoes.length)];
            reportEnd(loser.name, randomPunish, "ÚLTIMO A SOLTAR!");
        }
    }

    async function startRouletteMatch(playerList) {
        const stateRef = ref(db, `rooms/${roomCode}/trigger_state`);
        await update(stateRef, { phase: 'ROULETTE_SPIN', activePlayerId: null });

        const playerIds = playerList.map(p => p.id);
        let currentIndex = 0;
        let speed = 90; 
        let spins = 0;
        const totalSpins = 20 + Math.floor(Math.random() * 15); 

        function spinStep() {
            const currentId = playerIds[currentIndex];
            update(stateRef, { activePlayerId: currentId });
            
            currentIndex = (currentIndex + 1) % playerIds.length;
            spins++;

            if(spins < totalSpins) {
                speed += 15; 
                setTimeout(spinStep, speed);
            } else {
                const chosenPlayer = playerList.find(p => p.id === currentId) || playerList[0];
                const randomPunish = punicoes[Math.floor(Math.random() * punicoes.length)];
                setTimeout(() => {
                    reportEnd(chosenPlayer.name, randomPunish, "SORTEADO NA ROLETA!");
                }, 700);
            }
        }

        setTimeout(spinStep, 500);
    }

    function reportEnd(name, punishment, headerText = "ÚLTIMO LUGAR!") {
        update(ref(db, `rooms/${roomCode}/trigger_state`), {
            phase: 'RESULT',
            loserName: name || "JOGADOR",
            punishment: punishment,
            reasonText: headerText
        });
    }

    function showResult(name, text, reasonText) {
        document.getElementById('punish-modal').style.display = 'flex';
        document.getElementById('punish-header').innerText = reasonText || "FIM DA RODADA!";
        document.getElementById('loser-name').innerText = name.toUpperCase();
        document.getElementById('punish-desc').innerText = text;
    }

    window.resetRound = async () => {
        sfx.win();
        await update(ref(db, `rooms/${roomCode}/trigger_state`), { 
            phase: 'IDLE', 
            loserName: null, 
            punishment: null, 
            activePlayerId: null 
        });
        await remove(ref(db, `rooms/${roomCode}/results`));
        
        const playersSnap = await get(ref(db, `rooms/${roomCode}/players`));
        const updates = {};
        
        Object.entries(playersSnap.val() || {}).forEach(([uid]) => {
            updates[`rooms/${roomCode}/players/${uid}/isReady`] = false;
        });
        
        if(Object.keys(updates).length > 0) await update(ref(db), updates);
        document.getElementById('punish-modal').style.display = 'none';
    };

    setTimeout(() => {
        notifyIsland("ONLINE", myName.toUpperCase());
    }, 800);
</script>
