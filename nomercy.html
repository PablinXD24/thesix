<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NO MERCY - Alvo Marcado</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap');

        :root {
            --neon-red: #ff0000; /* Vermelho sangue bem vivo */
            --deep-red: #8b0000;
            --neon-green: #1ed760; /* Verde vibrante anterior */
            --neon-yellow: #f2e205;
            --bg-dark: #ffffff;
            --glass-bg: #ffffff;
            --glass-border: #000000;
            --font-display: 'Architects Daughter', cursive;
            --font-data: 'Architects Daughter', cursive;
            --island-bezier: cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: black;
            height: 100vh; width: 100vw; overflow: hidden;
            font-family: var(--font-display);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-image: radial-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 20px 20px;
            transition: background 0.5s ease;
        }

        /* DYNAMIC ISLAND STYLE REFINADO */
        .island-container {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 100%; display: flex; justify-content: center; pointer-events: none;
        }
        .island {
            background: #000000; color: #ffffff; padding: 10px 22px;
            border-radius: 30px; display: flex; align-items: center; gap: 12px;
            min-width: 180px; max-width: 90%; transition: all 0.5s var(--island-bezier);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer; pointer-events: auto;
            border: 2px solid #000000; flex-direction: column; height: 43px; overflow: hidden;
        }
        .island-compact {
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 20px;
            transition: opacity 0.2s ease, transform 0.3s var(--island-bezier);
        }
        .island-title { font-size: 0.85rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
        .island-icon { font-size: 0.9rem; animation: pulse 1.5s infinite; color: var(--neon-red); }
        
        /* Island Expandida Suave */
        .island.expanded {
            border-radius: 20px; padding: 20px; min-width: 290px; height: 320px;
        }
        .island.expanded .island-compact {
            opacity: 0.4; transform: scale(0.95);
        }
        .island-content {
            width: 100%; flex-direction: column; gap: 12px; margin-top: 15px;
            opacity: 0; transform: translateY(-10px) scale(0.95); pointer-events: none;
            transition: opacity 0.3s ease 0.1s, transform 0.4s var(--island-bezier) 0.1s;
            overflow-y: auto; display: flex; height: calc(100% - 35px);
            padding-right: 2px;
        }
        .island.expanded .island-content { 
            opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
        }
        
        .island-player-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border: 1px dashed rgba(255,255,255,0.3); border-radius: 10px;
            font-family: var(--font-data); font-size: 0.95rem; background: rgba(255,255,255,0.05);
            animation: islandItemPop 0.4s var(--island-bezier) both;
        }
        .island-player-name { font-weight: bold; text-transform: uppercase; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .island-skulls { display: flex; gap: 5px; color: rgba(255,255,255,0.2); }
        .island-skulls .active-skull { color: var(--neon-red); transform: scale(1.1); }

        /* Barra de rolagem customizada e minimalista para a island */
        .island-content::-webkit-scrollbar { width: 4px; }
        .island-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        @keyframes islandItemPop {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .noise { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('https://grainy-gradients.vercel.app/noise.svg'); 
            opacity: 0.07; pointer-events: none; z-index: 999; filter: contrast(150%) grayscale(100%);
        }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; padding: 30px;
            align-items: center; justify-content: center; text-align: center;
            z-index: 10;
        }
        .screen.active { display: flex; animation: slideUp 0.4s ease forwards; }
        
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        h1 { 
            font-size: clamp(3.5rem, 12vw, 4.5rem); font-weight: 900; line-height: 0.85; 
            text-transform: uppercase; margin-bottom: 25px; 
            color: #000000;
            letter-spacing: -1px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 15px 225px 15px 255px/255px 15px 255px 15px;
            padding: 40px 30px;
            width: 100%; max-width: 400px;
            box-shadow: 4px 5px 0px #000000;
            position: relative; z-index: 2;
        }

        .btn { 
            background: white; color: black; border: 2px solid #000000; padding: 22px; 
            border-radius: 15px 225px 15px 255px/255px 15px 255px 15px; font-family: var(--font-display); font-weight: 800; 
            font-size: 1.1rem; width: 100%; cursor: pointer; text-transform: uppercase; 
            margin-bottom: 15px; transition: 0.1s ease;
            box-shadow: 4px 5px 0px #000000;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 7px 0px #000000; }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000000; }
        
        .btn-safe { background: #ffffff; color: black; }
        .btn-hard { background: #ffffff; color: var(--neon-red); border-color: var(--neon-red); border-style: dashed; }

        .strikes-container { display: flex; gap: 25px; justify-content: center; margin-bottom: 25px; }
        .strike-skull { 
            font-size: 1.8rem;
            color: #e5e5e5; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .strike-skull.active { 
            color: var(--neon-red); 
            transform: scale(1.3) rotate(-5deg); 
        }

        .vote-row { display: flex; gap: 12px; width: 100%; margin-top: 25px; }
        .btn-fail { background: #ffffff; border: 2px solid var(--neon-red); color: var(--neon-red); border-style: dashed; box-shadow: 4px 5px 0px var(--neon-red); }
        .btn-fail:hover { box-shadow: 6px 7px 0px var(--neon-red); }
        .btn-pass { background: #ffffff; border: 2px solid var(--neon-green); color: var(--neon-green); box-shadow: 4px 5px 0px var(--neon-green); }
        .btn-pass:hover { box-shadow: 6px 7px 0px var(--neon-green); }

        .flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; transition: background 0.1s; }
        
        .strike-bg { background-color: #ffe6e6 !important; animation: shake 0.4s ease-in-out; }
        .safe-bg { background-color: #e6f9ed !important; color: black; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        .target-badge { 
            background: var(--neon-red); color: white; font-weight: 900;
            padding: 6px 16px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 0.85rem; 
            letter-spacing: 2px; margin-bottom: 12px; display: none; 
            animation: pulse 1s infinite;
            border: 2px solid #000000;
            box-shadow: 2px 3px 0px #000000;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }

        #target-player-display { color: var(--neon-red); font-weight: 700; margin-bottom: 15px; text-decoration: underline; }
        .streak-info { font-size: 0.8rem; color: var(--neon-green); font-family: var(--font-data); margin-bottom: 10px; display: none; font-weight: bold; }
        
        .punishment-box { 
            background: #ffffff; border: 4px double var(--neon-red); 
            padding: 25px; border-radius: 20px 15px 20px 15px/15px 20px 15px 20px; margin-top: 25px; 
            box-shadow: 6px 7px 0px var(--neon-red);
            animation: slideUp 0.3s ease;
        }

        /* ANIMAÇÃO DA GARRAFINHA EM ICONE */
        #screen-bottle-spin {
            background: #ffffff;
            z-index: 95;
        }
        .bottle-icon-container {
            font-size: 6rem;
            color: #000000;
            display: inline-block;
            filter: drop-shadow(4px 5px 0px #000000);
            animation: fastSpin 1.2s cubic-bezier(0.1, 0.8, 0.1, 1) infinite;
        }
        @keyframes fastSpin {
            0% { transform: rotate(0deg) scale(0.9); }
            100% { transform: rotate(1440deg) scale(1.1); }
        }
    </style>
</head>
<body>

<div class="noise"></div>
<div id="flash-layer" class="flash-overlay"></div>

<!-- DYNAMIC ISLAND (Placar Dinâmico de Participantes) -->
<div class="island-container">
    <div class="island" id="dynamic-island" onclick="toggleIsland(event)">
        <div class="island-compact">
            <i class="fa-solid fa-skull-crossbones island-icon"></i>
            <span class="island-title">PARTICIPANTES</span>
        </div>
        <div class="island-content" id="island-participants-list">
            <!-- Injetado dinamicamente via Firebase -->
        </div>
    </div>
</div>

<audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="snd-strike" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3"></audio>
<audio id="snd-safe" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="snd-roulette" src="https://assets.mixkit.co/active_storage/sfx/123/123-preview.mp3" loop></audio>

<div id="screen-lobby" class="screen active">
    <div style="margin-bottom: 20px; opacity: 0.7; letter-spacing: 5px; font-weight: bold;">SISTEMA</div>
    <h1>NO MERCY</h1>
    <p id="lobby-text">Sincronizando banco de dados...</p>
    <div id="loading"><i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: #000000;"></i></div>
</div>

<div id="screen-mode-selection" class="screen">
    <div style="margin-bottom: 20px; opacity: 0.7; letter-spacing: 5px; font-weight: bold;">HOST CONFIG</div>
    <h1>ESCOLHA O MODO</h1>
    <div class="card">
        <button class="btn btn-safe" onclick="selectGameMode('safe')"><i class="fa-solid fa-shield-heart" style="color: var(--neon-green);"></i> MODO SAFE</button>
        <button class="btn btn-hard" onclick="selectGameMode('hard')"><i class="fa-solid fa-fire" style="color: var(--neon-red);"></i> MODO HARD</button>
        <p style="font-size: 0.8rem; opacity: 0.6; margin-top: 15px; margin-bottom: 0;">O modo define a lista de desafios que será carregada.</p>
    </div>
</div>

<div id="screen-game" class="screen">
    <div id="target-badge" class="target-badge">⚠️ ALVO MARCADO ⚠️</div>
    <div id="streak-info" class="streak-info">SOBREVIVEU 1/2 RODADAS</div>
    
    <div id="current-player-name" style="font-size: 2.8rem; font-weight: 900; margin-bottom: 5px; color: black; margin-top: 15px;">...</div>
    <div id="target-player-display"></div>
    
    <div class="strikes-container" id="game-strikes-display">
        <i class="fa-solid fa-skull strike-skull" id="s1"></i>
        <i class="fa-solid fa-skull strike-skull" id="s2"></i>
        <i class="fa-solid fa-skull strike-skull" id="s3"></i>
    </div>
    
    <div class="card">
        <div id="challenge-text" style="font-size: 1.6rem; font-weight: 700; line-height: 1.3;">...</div>
    </div>

    <div id="controls-area" style="width: 100%; max-width: 400px; margin-top: 10px;"></div>
    <p id="wait-msg" class="pulse-text" style="margin-top:20px; display:none; font-family: var(--font-data); font-size: 0.8rem; opacity: 0.6;"></p>
</div>

<div id="screen-bottle-spin" class="screen">
    <div class="bottle-icon-container">
        <i class="fa-solid fa-bottle-droplet"></i>
    </div>
    <h2 style="font-family: var(--font-display); font-weight: 900; margin-top: 40px; text-transform: uppercase; letter-spacing: 2px;">PROCESSANDO VEREDITO...</h2>
</div>

<div id="screen-roulette" class="screen" style="background: white;">
    <i class="fa-solid fa-skull-crossbones" style="font-size: 7rem; color: var(--neon-red); margin-bottom: 30px;"></i>
    <h2 style="color: black; letter-spacing: 3px; font-weight: 900; font-size: 2rem;">SORTEANDO<br>PUNIÇÃO</h2>
</div>

<div id="screen-result" class="screen">
    <div id="result-content" style="width: 100%; max-width: 450px;"></div>
</div>

<div id="screen-winner" class="screen" style="background: #ffffff; color: black;">
    <i class="fa-solid fa-trophy" style="font-size: 6rem; margin-bottom: 25px; color: var(--neon-yellow);"></i>
    <h1 style="color: black;">SOBREVIVENTE</h1>
    <h2 id="winner-name" style="font-size: 3.5rem; font-weight: 900; text-transform: uppercase; text-decoration: underline; color: var(--neon-green);">NOME</h2>
    <button class="btn" style="background: black; color: white; margin-top: 40px; width: 80%; max-width: 400px; margin-left: auto; margin-right: auto;" onclick="window.location.href='index.html'">FINALIZAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1buacNarLY8ELWla6yeqTi4L0vTdloSc",
        authDomain: "wrapped-fad94.firebaseapp.com",
        databaseURL: "https://wrapped-fad94-default-rtdb.firebaseio.com",
        projectId: "wrapped-fad94",
        storageBucket: "wrapped-fad94.firebasestorage.app",
        messagingSenderId: "360236097664",
        appId: "1:360236097664:web:76777f529c18623bf1c665"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const playSound = (id) => {
        const audio = document.getElementById(id);
        if(audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Som bloqueado"));
        }
    }

    const stopSound = (id) => {
        const audio = document.getElementById(id);
        if(audio) { audio.pause(); audio.currentTime = 0; }
    }

    // FUNÇÃO REFINADA PARA INTERAÇÃO DA DYNAMIC ISLAND
    window.toggleIsland = (event) => {
        if(event) event.stopPropagation();
        const island = document.getElementById('dynamic-island');
        if(island) {
            island.classList.toggle('expanded');
            playSound('snd-click');
        }
    }

    // Fecha a island automaticamente ao clicar fora dela
    document.addEventListener('click', (e) => {
        const island = document.getElementById('dynamic-island');
        if (island && island.classList.contains('expanded') && !island.contains(e.target)) {
            island.classList.remove('expanded');
        }
    });

    let gameChallenges = [];
    let extremeChallenges = [];
    let punishments = ["VIRE 1 DOSE DE TEQUILA/CACHAÇA", "BEBA 2 DOSES DE ALGO FORTE", "ESCOLHA ALGUÉM PARA BEBER COM VOCÊ", "TOME UM COPO DE ÁGUA COM SAL", "FALE O RESTO DA RODADA COM SOTAQUE ESTRANGEIRO", "DÊ 5 VOLTAS EM TORNO DE SI MESMO E TENTE ANDAR EM LINHA RETA", "DEIXE ALGUÉM POSTAR UM STATUS NO SEU WHATSAPP", "MOSTRE A ÚLTIMA FOTO DA SUA GALERIA", "BEBA SEM USAR AS MÃOS", "PAGUE 10 FLEXÕES"];

    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room');
    const myId = localStorage.getItem('wrapped_uid');
    
    let amIHost = false;
    let rouletteInterval = null;
    let isUpdating = false;

    if(!roomCode || !myId) {
        alert("Erro: Entre pelo Wrapped.");
        window.location.href = 'index.html';
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => {
            s.classList.remove('active');
            s.style.display = 'none';
        });
        const target = document.getElementById(id);
        if(target) {
            target.style.display = 'flex';
            setTimeout(() => target.classList.add('active'), 10);
        }
        document.body.className = '';
        document.getElementById('flash-layer').style.background = 'transparent';
        if(rouletteInterval) { clearInterval(rouletteInterval); rouletteInterval = null; stopSound('snd-roulette'); }
    }

    async function selectGameMode(mode) {
        playSound('snd-click');
        const file = mode === 'safe' ? 'safedesafios.json' : 'desafios.json';
        
        try {
            const response = await fetch(file);
            const data = await response.json();
            
            const pool = data.challenges || []; 
            const extremePool = data.extremeChallenges || [];
            const punishmentPool = data.punishments || punishments;

            await update(ref(db, `rooms/${roomCode}`), {
                gameMode: mode,
                nomercy_status: 'waiting_start', 
                loadedChallenges: pool,
                loadedExtreme: extremePool,
                loadedPunishments: punishmentPool
            });
        } catch (error) {
            alert("Erro ao carregar lista de desafios: " + file);
            console.error(error);
        }
    }
    window.selectGameMode = selectGameMode;

    function initGameLoop() {
        const roomRef = ref(db, `rooms/${roomCode}`);
        onValue(roomRef, (snap) => {
            const data = snap.val();
            if(!data) return; 

            if(data.host === myId) amIHost = true;
            
            gameChallenges = data.loadedChallenges || [];
            extremeChallenges = data.loadedExtreme || [];
            punishments = data.loadedPunishments || punishments;

            // Renderização da lista de participantes dentro da Dynamic Island
            if(data.players) {
                const islandList = document.getElementById('island-participants-list');
                if(islandList) {
                    let htmlList = '';
                    let delay = 0;
                    Object.entries(data.players).forEach(([id, player]) => {
                        const sCount = player.strikes || 0;
                        htmlList += `
                            <div class="island-player-row" style="animation-delay: ${delay}ms;">
                                <span class="island-player-name">${player.name}</span>
                                <div class="island-skulls">
                                    <i class="fa-solid fa-skull ${sCount >= 1 ? 'active-skull' : ''}"></i>
                                    <i class="fa-solid fa-skull ${sCount >= 2 ? 'active-skull' : ''}"></i>
                                    <i class="fa-solid fa-skull ${sCount >= 3 ? 'active-skull' : ''}"></i>
                                </div>
                            </div>
                        `;
                        delay += 40;
                    });
                    islandList.innerHTML = htmlList;
                }
            }

            if(data.nomercy_status === 'game_over') {
                showScreen('screen-winner');
                document.getElementById('winner-name').innerText = data.winnerName;
            }
            else if(!data.nomercy_status && amIHost) {
                showScreen('screen-mode-selection');
            }
            else if(!data.nomercy_status && !amIHost) {
                showScreen('screen-lobby');
                document.getElementById('lobby-text').innerText = "Aguardando Host escolher o modo...";
            }
            else if(data.nomercy_status === 'round') {
                showScreen('screen-game');
                renderGameRound(data);
                if(amIHost) checkVotes(data);
            }
            else if(data.nomercy_status === 'roulette_spin') {
                showScreen('screen-roulette');
                playSound('snd-roulette');
                if(!rouletteInterval) {
                    rouletteInterval = setInterval(() => {
                        const flash = document.getElementById('flash-layer');
                        flash.style.background = Math.random() > 0.7 ? 'rgba(255, 0, 0, 0.15)' : 'transparent';
                    }, 100);
                }
            }
            else if(data.nomercy_status === 'round_result_fail') {
                showScreen('screen-result');
                playSound('snd-strike');
                document.body.classList.add('strike-bg');
                const pid = data.roundPlayer;
                const strikes = data.players[pid]?.strikes || 0;
                
                document.getElementById('result-content').innerHTML = `
                    <div style="animation: shake 0.4s ease-in-out;">
                        <i class="fa-solid fa-skull-crossbones" style="font-size:6rem; color:var(--neon-red); margin-bottom:15px; filter: drop-shadow(4px 4px 0px #000);"></i>
                        <h1 style="font-size:4rem; color:var(--neon-red); text-shadow: 3px 3px 0px #000000; -webkit-text-stroke: 1px black; margin-bottom: 5px;">MÁXIMA PUNIÇÃO</h1>
                        <p style="font-size:1.6rem; font-weight:900; color:black; margin-bottom:10px; text-transform:uppercase;">🚨 ${pid === myId ? "VOCÊ COLOCOU TUDO A PERDER" : data.roundPlayerName + " COLOCOU TUDO A PERDER"}</p>
                        
                        <div style="background:var(--neon-red); color:white; padding:10px 30px; font-weight:900; font-size:1.3rem; border-radius:15px 225px 15px 255px/255px 15px 255px 15px; border:2px solid #000000; margin-top:5px; display:inline-block; box-shadow: 4px 4px 0px #000000; text-transform:uppercase;">
                            ${strikes} ${strikes === 1 ? 'STRIKE' : 'STRIKES'}
                        </div>
                        
                        <div class="punishment-box">
                            <h3 style="color:var(--neon-red); margin-bottom:12px; font-size: 1.1rem; letter-spacing: 2px; font-weight:900; text-transform:uppercase; text-decoration:underline;">ORDEM DO SISTEMA</h3>
                            <p style="font-size:1.8rem; font-weight:900; color:black; line-height:1.2; text-transform:uppercase;">${data.currentPunishment || "BEBA!"}</p>
                        </div>
                    </div>
                `;
            }
            else if(data.nomercy_status === 'round_result_safe') {
                showScreen('screen-result');
                playSound('snd-safe');
                document.body.classList.add('safe-bg');
                document.getElementById('result-content').innerHTML = `
                    <i class="fa-solid fa-check-circle" style="font-size:6rem; color:var(--neon-green); margin-bottom:20px;"></i>
                    <h1 style="font-size:4.5rem; color:var(--neon-green);">SAFE</h1>
                    <p style="color:black; font-weight:900; letter-spacing: 1px; text-decoration: underline;">MISSÃO CONCLUÍDA</p>
                `;
            }
            else {
                if(amIHost && !isUpdating) startNewRound(data);
            }
        });
    }

    function renderGameRound(data) {
        const pid = data.roundPlayer;
        const strikes = data.players[pid]?.strikes || 0;
        const streak = data.players[pid]?.safeStreak || 0;

        document.getElementById('current-player-name').innerText = data.roundPlayerName;
        document.getElementById('challenge-text').innerText = (data.roundChallenge || "...").replace(/{target}/g, data.roundTarget || "ALGUÉM");
        
        document.getElementById('s1').className = strikes >= 1 ? 'fa-solid fa-skull strike-skull active' : 'fa-solid fa-skull strike-skull';
        document.getElementById('s2').className = strikes >= 2 ? 'fa-solid fa-skull strike-skull active' : 'fa-solid fa-skull strike-skull';
        document.getElementById('s3').className = strikes >= 3 ? 'fa-solid fa-skull strike-skull active' : 'fa-solid fa-skull strike-skull';

        if(strikes >= 3) {
            document.getElementById('target-badge').style.display = 'inline-block';
            document.getElementById('streak-info').style.display = 'block';
            document.getElementById('streak-info').innerText = `SOBREVIVÊNCIA: ${streak}/2 RODADAS`;
        } else {
            document.getElementById('target-badge').style.display = 'none';
            document.getElementById('streak-info').style.display = 'none';
        }

        const controls = document.getElementById('controls-area');
        if(pid === myId) {
            controls.innerHTML = ``;
        } else {
            const myVote = data.roundVotes?.[myId];
            if(myVote) {
                controls.innerHTML = `<div style="background: #ffffff; padding: 20px; border-radius: 15px; border: 2px solid #000000; font-weight: bold; box-shadow: 3px 4px 0px #000000;">Veredito: ${myVote === 'pass' ? '<b style="color: var(--neon-green); text-decoration: underline;">CUMPRIU</b>' : '<b style="color: var(--neon-red); border-bottom: 2px dashed var(--neon-red);">NEGADO</b>'}</div>`;
            } else {
                controls.innerHTML = `<div class="vote-row"><button class="btn btn-fail" onclick="castVote('fail')">NÃO FEZ</button><button class="btn btn-pass" onclick="castVote('pass')">FEZ</button></div>`;
            }
        }
    }

    window.castVote = (vote) => {
        playSound('snd-click');
        set(ref(db, `rooms/${roomCode}/roundVotes/${myId}`), vote);
    }

    async function startNewRound(roomData) {
        if (isUpdating) return;
        isUpdating = true;
        
        const players = roomData.players;
        const activeIds = Object.keys(players).sort();
        let nextIndex = roomData.roundPlayer ? (activeIds.indexOf(roomData.roundPlayer) + 1) % activeIds.length : 0;
        const nextId = activeIds[nextIndex];
        
        const otherPlayers = activeIds.filter(id => id !== nextId);
        const randomTarget = otherPlayers.length > 0 ? players[otherPlayers[Math.floor(Math.random() * otherPlayers.length)]].name : "ALGUÉM";

        const isExtreme = (players[nextId].strikes || 0) >= 3;
        const pool = isExtreme ? extremeChallenges : gameChallenges;
        const rndChall = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : "Sem desafios carregados.";

        await update(ref(db, `rooms/${roomCode}`), {
            nomercy_status: 'round',
            roundPlayer: nextId,
            roundPlayerName: players[nextId].name,
            roundTarget: randomTarget,
            roundChallenge: rndChall,
            roundVotes: null,
            votesProcessed: null
        });
        isUpdating = false;
    }

    async function checkVotes(data) {
        if(data.votesProcessed || isUpdating) return;
        const votes = data.roundVotes || {};
        const required = Object.keys(data.players).length - 1;
        if(Object.keys(votes).length >= required && required > 0) {
            isUpdating = true;
            await update(ref(db, `rooms/${roomCode}`), { votesProcessed: true });
            let fails = Object.values(votes).filter(v => v === 'fail').length;
            const pid = data.roundPlayer;
            const pData = data.players[pid];

            // Ativa a tela da garrafinha antes do resultado final
            showScreen('screen-bottle-spin');

            setTimeout(async () => {
                if(fails > (Object.keys(votes).length / 2)) {
                    const rndPunish = punishments[Math.floor(Math.random() * punishments.length)];
                    await update(ref(db, `rooms/${roomCode}`), { nomercy_status: 'roulette_spin', currentPunishment: rndPunish });
                    setTimeout(async () => {
                        await update(ref(db, `rooms/${roomCode}/players/${pid}`), { strikes: (pData.strikes || 0) + 1, safeStreak: 0 });
                        await update(ref(db, `rooms/${roomCode}`), { nomercy_status: 'round_result_fail' });
                        setTimeout(() => { isUpdating = false; startNewRound(data); }, 5000);
                    }, 3000);
                } else {
                    let newStreak = (pData.safeStreak || 0) + 1;
                    let newStrikes = pData.strikes || 0;
                    if(newStrikes >= 3 && newStreak >= 2) { newStrikes = 0; newStreak = 0; }
                    await update(ref(db, `rooms/${roomCode}/players/${pid}`), { strikes: newStrikes, safeStreak: newStreak });
                    await update(ref(db, `rooms/${roomCode}`), { nomercy_status: 'round_result_safe' });
                    setTimeout(() => { isUpdating = false; startNewRound(data); }, 3000);
                }
            }, 1200); // 1.2 segundos rodando a garrafinha
        }
    }

    initGameLoop();
</script>
</body>
